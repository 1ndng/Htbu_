<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:TX;src:url(../SatsukiGendaiMincho-M.ttf)}
body{margin:0}</style><canvas id="c" width="1024" height="1024"></canvas><script>
async function draw(){await document.fonts.load('100px TX','Htbu');
const S=1024,c=document.getElementById('c').getContext('2d'),M=S*.07,W=S-2*M;
/* 白底（iOS 會自己裁圓角，四角不能透明） */
c.fillStyle='#fff';c.fillRect(0,0,S,S);
/* Htbu：Win95 預設主題色②、Satsuki 加粗；參考網頁連結散落的感覺——不旋轉、大小差很多、有的斜體、有的底線 */
c.font=`100px TX`;const tw=c.measureText('Htbu').width;c.fillStyle=c.strokeStyle='#000080';c.lineJoin='round';
/* [x, 基線 y, 字寬（方框比例）, 斜體, 底線] */
[[.09,.27,.42,1,1],[.60,.33,.22,0,1],[.30,.52,.40,0,0],[.66,.63,.16,1,1],[.11,.80,.30,0,1],
 [.64,.15,.15,0,0],[.05,.60,.17,1,1],[.76,.47,.13,0,0],[.52,.89,.19,1,0]].forEach(([x,y,w,it,ul])=>{const f=100*W*w/tw;c.save();c.translate(M+W*x,M+W*y);if(it)c.transform(1,0,-.2,1,0,0);c.font=`${f}px TX`;c.lineWidth=f*.06;c.strokeText('Htbu',0,0);c.fillText('Htbu',0,0);if(ul)c.fillRect(0,f*.1,W*w,Math.max(2,f*.05));c.restore()});
document.title='done'}
draw();</script>
