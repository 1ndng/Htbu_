<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N年日記</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e7566">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="N年日記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@600&display=swap">
<style>
:root{--bg:#eceff2;--card:#fff;--ink:#1c2630;--mute:#66737f;--line:#d3dae0;--acc:#0e7566;--soft:#e2f0ed;--mark:rgba(14,117,102,.28);--onacc:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171c;--card:#1b232b;--ink:#e6ecf0;--mute:#94a1ac;--line:#2f3a44;--acc:#4fc1ae;--soft:#1a3531;--mark:rgba(79,193,174,.32);--onacc:#10201d}}
:root[data-theme="dark"]{--bg:#12171c;--card:#1b232b;--ink:#e6ecf0;--mute:#94a1ac;--line:#2f3a44;--acc:#4fc1ae;--soft:#1a3531;--mark:rgba(79,193,174,.32);--onacc:#10201d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Noto Sans TC",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 14px 96px}
h1{font:600 20px "Noto Serif TC",serif;margin:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:13px}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
#ppl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border-radius:99px}.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}.chip.add{color:var(--mute);border-style:dashed}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who{font-size:13px;font-weight:500;color:var(--c);margin-bottom:2px}.who::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px}
.bar input,.bar select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 8px}
.day{font:600 32px/1.2 "Noto Serif TC",serif;margin:14px 0 2px}
.sub{color:var(--mute);margin:0 0 22px}
.tl{border-left:2px solid var(--line);margin-left:6px}
.row{position:relative;padding:0 0 22px 22px}
.row::before{content:"";position:absolute;left:-7px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--mute)}
.row.has::before{background:var(--acc);border-color:var(--acc)}
.row.hl .card{box-shadow:0 0 0 2px var(--acc)}
.yr{font:600 20px "Noto Serif TC",serif;margin-right:8px}.ago{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-top:6px}
.card.empty{background:transparent;border-style:dashed;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:8px}
.txt{white-space:pre-wrap;word-break:break-word;margin:0 0 6px}.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.media{display:grid;grid-template-columns:repeat(auto-fill,72px);gap:6px;margin:6px 0}
.th{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;cursor:zoom-in;background:#0002}.th img,.th video{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;background:#0003;pointer-events:none}
.media audio{grid-column:1/-1;width:100%;height:34px}
.links a{display:block;color:var(--acc);word-break:break-all;font-size:13px}
.edit{font-size:13px;margin-top:6px;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(560px,92vw);padding:14px}
dialog::backdrop{background:#0008}
dialog h2{font:600 17px "Noto Serif TC",serif;margin:0 0 10px}
textarea,dialog input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;margin-bottom:6px}
label{display:block;font-size:14px;color:var(--mute)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.acts.end{justify-content:flex-end;margin-top:14px}
.more{display:block;margin:0 auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;max-width:90vw;z-index:9}
.note{background:var(--soft);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.tm{font:600 15px "Noto Serif TC",serif;color:var(--acc);margin-bottom:2px}
.tcol .card{border-left:3px solid var(--acc)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.split>div{min-width:0}
.split .media{grid-template-columns:repeat(auto-fill,56px)}.split .th{width:56px;height:56px}
.lh{display:flex;justify-content:space-between;align-items:center}
.r{display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
#tv{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 8px}#tv:disabled{opacity:.4}
#dl{margin-right:auto;color:#c0392b}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--acc);color:var(--onacc);border:0;border-radius:99px;padding:11px 18px;font-size:14px;font-weight:500;box-shadow:0 4px 14px #0004}
#fab[hidden]{display:none}
#lb{background:transparent;border:0;padding:0;width:auto;max-width:96vw;color:#fff;overflow:visible}
#lb img,#lb video{display:block;max-width:94vw;max-height:80vh;border-radius:8px;margin:auto}
#lbx{position:absolute;top:-38px;right:0;background:#0009;color:#fff;border-color:#fff5}
.tb{display:flex;gap:4px;align-items:center}.tb button{padding:1px 8px}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid var(--line)}
#tc{width:38px;height:30px;padding:0;border:0;background:none}
.top .acts{margin:0}
@supports (-webkit-touch-callout:none){textarea,input,select{font-size:16px}}
.rm{position:relative}.rm>button{position:absolute;top:4px;right:4px;padding:0 8px;border-radius:99px}
</style>
</head>
<body>
<main>
<div class="top"><h1>N年日記</h1><div class="acts"><button onclick="openTh()">主題色</button><button id="bkb" onclick="openBk()">備份</button></div></div>
<div id="ppl"></div>
<div id="app"></div>
</main>

<dialog id="pd">
<h2>新增對象</h2>
<input type="text" id="pn" placeholder="填入你想記錄的對象" maxlength="30">
<div class="acts end"><button onclick="pd.close()">取消</button><button class="pri" onclick="addP()">建立</button></div>
</dialog>

<dialog id="ed">
<h2 id="et"></h2>
<label>時間</label>
<div class="acts">
<label class="r"><input type="radio" name="tm" value="none" checked> 不記時間</label>
<label class="r"><input type="radio" name="tm" value="now"> 現在時間</label>
<label class="r"><input type="radio" name="tm" value="manual"> 手動輸入</label>
<input type="time" id="tv" disabled aria-label="時間">
</div>
<div class="lh"><label for="tx">文字</label><div class="tb"><button class="edit" style="margin:0" onclick="wrap('**')" aria-label="粗體"><b>B</b></button><button class="edit" style="margin:0" onclick="wrap('*')" aria-label="斜體"><i>I</i></button><button class="edit" style="margin:0" onclick="wrap('==')" aria-label="高光"><mark>高光</mark></button><button class="edit" style="margin:0" onclick="$('#tx').value=''">清除</button></div></div>
<textarea id="tx" rows="3" placeholder="這天發生了什麼？　支援 **粗體**　*斜體*　==高光=="></textarea>
<div class="lh"><label for="lk">連結（每行一個）</label><button class="edit" onclick="$('#lk').value=''">清除連結</button></div>
<textarea id="lk" rows="1" placeholder="https://"></textarea>
<div class="acts">
<button onclick="fi.click()">＋ 照片／影片／音檔</button>
<button id="rc" onclick="toggleRec()">● 錄音</button>
<input type="file" id="fi" multiple accept="image/*,video/*,audio/*" hidden>
</div>
<div id="dm" class="media"></div>
<div class="acts end"><button id="dl" onclick="delEntry(this)">刪除這則</button><button onclick="$('#ed').close()">取消</button><button class="pri" onclick="save()">儲存</button></div>
</dialog>
<dialog id="bk">
<h2>備份與還原</h2>
<p class="sub" id="blast" style="margin:0 0 12px"></p>
<label>匯出全部對象與紀錄</label>
<div class="acts"><button onclick="prepBackup()">準備備份檔</button><button id="bsave" class="pri" style="display:none" onclick="saveBackup()">儲存備份檔</button></div>
<p class="sub" id="bst" style="margin:0 0 16px"></p>
<label>匯入備份檔（與現有資料合併，相同的紀錄以備份檔為準）</label>
<div class="acts"><button onclick="$('#bf').click()">選擇備份檔</button><input type="file" id="bf" accept=".json,application/json" hidden></div>
<p class="sub" id="bst2" style="margin:0"></p>
<div class="acts end"><button onclick="$('#bk').close()">關閉</button></div>
</dialog>
<dialog id="th">
<h2>主題色</h2>
<div class="acts" id="swt"></div>
<div class="acts"><label class="r">自訂 <input type="color" id="tc"></label><button onclick="setTheme(null)">恢復預設</button></div>
<div class="acts end"><button onclick="$('#th').close()">關閉</button></div>
</dialog>
<dialog id="lb"><button id="lbx" onclick="$('#lb').close()">關閉 ✕</button><div id="lbc"></div></dialog>
<button id="fab" hidden onclick="fabAdd()">＋ 今日新增</button>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a)k.startsWith('on')?e[k]=a[k]:e.setAttribute(k,a[k]);e.append(...c.flat().filter(x=>x!=null&&x!==false));return e};
let db,useMem=false,M={people:{},entries:{}},people=[],cur=null,E={},urls=[],extra=0,hy=null,multi=false,msel=new Set(),yf=null,edDate=null,edK=null,dArm=false,draft=[];
const now=new Date();let mo=now.getMonth()+1,dy=now.getDate();

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('nyear-diary',1);
q.onupgradeneeded=()=>{q.result.createObjectStore('people',{keyPath:'id'});q.result.createObjectStore('entries',{keyPath:'k'}).createIndex('pid','pid')};
q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>{useMem=true;r()}}catch(e){useMem=true;r()}})}
const req=(st,mode,f)=>new Promise((res,rej)=>{const t=db.transaction(st,mode);const r=f(t.objectStore(st));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
const dbAll=st=>useMem?Promise.resolve(Object.values(M[st])):req(st,'readonly',s=>s.getAll());
const dbPut=(st,v)=>useMem?(M[st][v.id||v.k]=v,Promise.resolve()):req(st,'readwrite',s=>s.put(v));
const dbDel=(st,k)=>useMem?(delete M[st][k],Promise.resolve()):req(st,'readwrite',s=>s.delete(k));
const dbByP=id=>useMem?Promise.resolve(Object.values(M.entries).filter(e=>e.pid===id)):req('entries','readonly',s=>s.index('pid').getAll(id));

async function loadView(){E={};const ids=multi?[...msel]:cur?[cur]:[];for(const id of ids)(await dbByP(id)).forEach(e=>(E[e.date]||(E[e.date]=[])).push(e))}
async function sel(id){cur=id;multi=false;hy=null;yf=null;extra=0;await loadView();render()}
async function toggleMulti(){multi=!multi;if(multi)msel=new Set(people.map(p=>p.id));hy=null;yf=null;await loadView();render()}
async function tog(id){msel.has(id)?msel.delete(id):msel.add(id);await loadView();render()}
async function addP(){const n=$('#pn').value.trim();if(!n)return;const p={id:'p'+Date.now(),name:n};await dbPut('people',p);people.push(p);$('#pn').value='';pd.close();sel(p.id)}
let delArm=false;
async function delP(b){if(!delArm){delArm=true;b.textContent='再按一次，刪除此對象與全部紀錄';return}
delArm=false;for(const e of Object.values(E).flat())await dbDel('entries',e.k);await dbDel('people',cur);people=people.filter(p=>p.id!==cur);await sel(people[0]?.id||null)}

const mu=m=>{const u=URL.createObjectURL(m.b);urls.push(u);return u};
const mEl=m=>{
 if(m.t==='audio')return h('audio',{src:mu(m),controls:''});
 const u=mu(m),go=()=>zoom(m.t,u);
 return h('div',{class:'th',role:'button',tabindex:'0','aria-label':'放大檢視',onclick:go,onkeydown:e=>{if(e.key==='Enter')go()}},
  m.t==='image'?h('img',{src:u,alt:'',loading:'lazy'}):h('video',{src:u+'#t=0.1',preload:'metadata',muted:'',playsinline:''}),
  m.t==='video'&&h('span',{class:'pl'},'▶'))};
function zoom(t,u){$('#lbc').replaceChildren(t==='image'?h('img',{src:u,alt:''}):h('video',{src:u,controls:'',autoplay:'',playsinline:''}));$('#lb').showModal()}
$('#lb').onclose=()=>$('#lbc').replaceChildren();
$('#lb').onclick=e=>{if(e.target===$('#lb'))$('#lb').close()};
function md(t){const out=[],re=/\*\*(.+?)\*\*|==(.+?)==|~~(.+?)~~|\*(.+?)\*/g;let i=0,m;
 while((m=re.exec(t))){if(m.index>i)out.push(t.slice(i,m.index));
  const tag=m[1]!=null?'strong':m[2]!=null?'mark':m[3]!=null?'del':'em';
  out.push(h(tag,{},...md(m[1]??m[2]??m[3]??m[4])));i=re.lastIndex}
 if(i<t.length)out.push(t.slice(i));return out}
function txtBits(t){if(!t)return[];const long=t.length>140||t.split('\n').length>4,d=h('div',{class:'txt'+(long?' clamp':'')},...md(t));
 return long?[d,h('button',{class:'edit',style:'margin:0 0 6px',onclick:e=>{e.target.textContent=d.classList.toggle('clamp')?'展開全文':'收合'}},'展開全文')]:[d]}
function wrap(m){const t=$('#tx'),a=t.selectionStart,b=t.selectionEnd,v=t.value;t.value=v.slice(0,a)+m+v.slice(a,b)+m+v.slice(b);t.focus();t.setSelectionRange(a+m.length,b+m.length)}
function updFab(){const b=$('#fab'),cy=now.getFullYear(),ok=!multi&&cur&&new Date(cy,mo-1,dy).getDate()===dy;b.hidden=!ok;if(!ok)return;
 const has=(E[`${cy}-${pad(mo)}-${pad(dy)}`]||[]).length,td=mo===now.getMonth()+1&&dy===now.getDate();
 b.textContent=has?'＋ 再記一則':td?'＋ 今日新增':`＋ 新增 ${mo}/${dy}`}
function fabAdd(){openEd(`${now.getFullYear()}-${pad(mo)}-${pad(dy)}`)}
/* 主題色 */
const TK='nyear-theme',PRE=['#0e7566','#2f6fdb','#7c4dbd','#d6457a','#d9622b','#b8860b','#c0392b','#4a5568'];
function applyTheme(x){const r=document.documentElement.style,mt=document.querySelector('meta[name=theme-color]');
 if(!/^#[0-9a-f]{6}$/i.test(x||'')){['--acc','--soft','--mark','--onacc'].forEach(k=>r.removeProperty(k));mt.content='#0e7566';return}
 const n=parseInt(x.slice(1),16);let R=n>>16,G=n>>8&255,B=n&255;
 const lum=()=>(.299*R+.587*G+.114*B)/255,dark=matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.dataset.theme!=='light';
 if(dark&&lum()<.5){const f=.45;R=Math.round(R+(255-R)*f);G=Math.round(G+(255-G)*f);B=Math.round(B+(255-B)*f)}
 r.setProperty('--acc',`rgb(${R},${G},${B})`);r.setProperty('--soft',`rgba(${R},${G},${B},.16)`);r.setProperty('--mark',`rgba(${R},${G},${B},.32)`);r.setProperty('--onacc',lum()>.62?'#111':'#fff');mt.content=x}
function setTheme(x){try{x?localStorage.setItem(TK,x):localStorage.removeItem(TK)}catch(e){}applyTheme(x);$('#tc').value=x||'#0e7566'}
function openTh(){let x=null;try{x=localStorage.getItem(TK)}catch(e){}$('#tc').value=x||'#0e7566';$('#th').showModal()}
$('#swt').replaceChildren(...PRE.map(c=>h('button',{class:'sw',style:'background:'+c,'aria-label':c,onclick:()=>setTheme(c)})));
$('#tc').oninput=e=>setTheme(e.target.value);
try{applyTheme(localStorage.getItem(TK))}catch(e){}

const nowStr=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const pname=id=>people.find(p=>p.id===id)?.name||'';
const card=(en,date)=>h('div',{class:'card'},
 multi&&h('div',{class:'who',style:'--c:hsl('+people.findIndex(p=>p.id===en.pid)*70+' 55% 52%)'},pname(en.pid)),
 en.time&&h('div',{class:'tm'},en.time),
 txtBits(en.text),
 en.media.length>0&&h('div',{class:'media'},en.media.map(mEl)),
 en.links.length>0&&h('div',{class:'links'},en.links.map(l=>h('a',{href:l,target:'_blank',rel:'noopener noreferrer'},l))),
 h('button',{class:'edit',onclick:()=>openEd(date,en.k)},'編輯'));
const rc=(el,...c)=>el.replaceChildren(...c.flat().filter(Boolean));
function render(){
 urls.forEach(URL.revokeObjectURL);urls=[];delArm=false;updFab();
 $('#bkb').textContent=people.length&&Date.now()-lastB()>1209600000?'備份 ●':'備份';
const on=p=>multi?msel.has(p.id):p.id===cur;
 rc($('#ppl'),...people.map(p=>h('button',{class:'chip'+(on(p)?' on':''),'aria-pressed':on(p),onclick:()=>multi?tog(p.id):sel(p.id)},(multi&&on(p)?'✓ ':'')+p.name)),h('button',{class:'chip add',onclick:()=>{pd.showModal();$('#pn').focus()}},'＋ 新增對象'),people.length>1&&h('button',{class:'chip add',style:multi?'color:var(--acc);border-color:var(--acc)':'',onclick:toggleMulti},multi?'結束合併回顧':'合併回顧'));
 const P=people.find(p=>p.id===cur),A=$('#app');
 if(!multi&&!P){rc(A,h('p',{class:'note'},'先新增一個對象，可以是你自己，也可以是你想追蹤的人。每個對象有各自獨立的日記。'));return}
 const cy=now.getFullYear(),ys=Object.keys(E).map(k=>+k.slice(0,4)),
  minY=Math.min(cy-4-extra*5,...ys,hy||cy,yf||cy),rows=[];let filled=0;
 for(let y=cy;y>=minY;y--){
  if(new Date(y,mo-1,dy).getDate()!==dy||(yf&&y!==yf))continue;
  const date=`${y}-${pad(mo)}-${pad(dy)}`,list=E[date]||[];if(list.length)filled++;
  const head=h('div',{},h('span',{class:'yr'},y+''),h('span',{class:'ago'},y===cy?'今年':(cy-y)+' 年前'));
  const lbl=y===cy?(mo===now.getMonth()+1&&dy===now.getDate()?'寫下今天':'記錄這天'):'補記這一年';
  let body;
  if(!list.length)body=h('div',{class:'card empty'},'還沒有紀錄',!multi&&h('button',{onclick:()=>openEd(date)},lbl));
  else{
   const T=list.filter(x=>x.time).sort((a,b)=>a.time<b.time?-1:1),N=list.filter(x=>!x.time);
   body=h('div',{},
    T.length&&N.length?h('div',{class:'split'},h('div',{class:'tcol'},T.map(x=>card(x,date))),h('div',{},N.map(x=>card(x,date)))):h('div',{class:T.length?'tcol':''},(T.length?T:N).map(x=>card(x,date))),
    !multi&&y!==cy&&h('button',{class:'edit',onclick:()=>openEd(date)},'＋ 再記一則'));
  }
  rows.push(h('div',{class:'row'+(list.length?' has':'')+(hy===y?' hl':'')},head,body));
 }
 const di=h('input',{type:'date',value:`${cy}-${pad(mo)}-${pad(dy)}`,'aria-label':'跳到某一天',onchange:e=>{const v=e.target.value.split('-').map(Number);if(v[2]){hy=v[0];mo=v[1];dy=v[2];render();document.querySelector('.hl')?.scrollIntoView({block:'center'})}}});
 const step=n=>()=>{const d=new Date(2024,mo-1,dy+n);mo=d.getMonth()+1;dy=d.getDate();hy=null;render()};
 const ysel=h('select',{'aria-label':'只看某一年',onchange:e=>{yf=+e.target.value||null;if(yf)hy=yf;render()}},h('option',{value:''},'全部年份'),...Array.from({length:cy-minY+1},(_,i)=>h('option',{value:cy-i},(cy-i)+'年')));
 ysel.value=yf||'';
 const del=h('button',{class:'edit',onclick:e=>delP(e.target)},'刪除此對象');
 rc(A,
  h('div',{class:'bar'},h('button',{onclick:step(-1),'aria-label':'前一天'},'‹'),di,h('button',{onclick:step(1),'aria-label':'後一天'},'›'),h('button',{onclick:()=>{mo=now.getMonth()+1;dy=now.getDate();hy=null;render()}},'今天'),ysel),
  h('div',{class:'day'},`${mo}月${dy}日`),
  h('p',{class:'sub'},multi?(msel.size?`合併回顧 ${msel.size} 位對象．這一天有紀錄的年份：${filled} 年`:'請點上方的名字，選擇要一起回顧的對象'):`${P.name}．這一天已記錄 ${filled} 年`),
  h('div',{class:'tl'},rows),
  h('button',{class:'more',onclick:()=>{extra++;render()}},'再往前 5 年'),
  !multi&&h('div',{style:'text-align:center;margin-top:24px'},del),
  useMem&&h('p',{class:'note'},'此瀏覽器無法長期儲存，關閉頁面後資料會消失。'),
  );
}

function drawDraft(){urls.forEach(URL.revokeObjectURL);urls=[];
 $('#dm').replaceChildren(...draft.map((m,i)=>h('div',{class:'rm',style:m.t==='audio'?'grid-column:1/-1':''},mEl(m),h('button',{'aria-label':'移除',onclick:()=>{draft.splice(i,1);drawDraft()}},'×'))))}
function setMode(v,val){document.querySelector(`input[name=tm][value=${v}]`).checked=true;const t=$('#tv');
 if(v==='now')t.value=nowStr();else if(v==='manual')t.value=val||t.value||nowStr();else t.value='';
 t.disabled=v!=='manual'}
document.querySelectorAll('input[name=tm]').forEach(r=>r.onchange=()=>setMode(r.value));
function openEd(date,k){edDate=date;edK=k||null;dArm=false;
 const en=k?E[date].find(x=>x.k===k):null,[y,m,d]=date.split('-').map(Number);
 $('#et').textContent=(multi&&en?pname(en.pid)+'・':'')+`${y}年${m}月${d}日`;$('#tx').value=en?.text||'';$('#lk').value=(en?.links||[]).join('\n');
 draft=[...(en?.media||[])];drawDraft();
 setMode(en?.time?'manual':'none',en?.time);
 $('#dl').style.display=en?'':'none';$('#dl').textContent='刪除這則';
 $('#ed').showModal()}
async function removeEntry(){if(!edK)return;await dbDel('entries',edK);E[edDate]=E[edDate].filter(x=>x.k!==edK);if(!E[edDate].length)delete E[edDate]}
async function delEntry(b){if(!dArm){dArm=true;b.textContent='再按一次確認刪除';return}
 dArm=false;try{await removeEntry();$('#ed').close();render()}catch(e){toast('刪除失敗')}}
$('#fi').onchange=e=>{for(const f of e.target.files){const t=['image','video','audio'].find(x=>f.type.startsWith(x));t?draft.push({t,b:f,n:f.name}):toast('不支援的檔案：'+f.name)}e.target.value='';drawDraft()};
let rec,chunks;
async function toggleRec(){const b=$('#rc');if(rec&&rec.state==='recording'){rec.stop();return}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(s);
 rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());draft.push({t:'audio',b:new Blob(chunks,{type:rec.mimeType}),n:'錄音'});b.textContent='● 錄音';drawDraft()};
 rec.start();b.textContent='■ 停止錄音'}catch(e){toast('無法使用麥克風，可改用「＋ 照片／影片／音檔」上傳音檔')}}
async function save(){
 if(rec&&rec.state==='recording')return toast('請先停止錄音');
 const text=$('#tx').value.trim(),links=$('#lk').value.split(/\s+/).filter(Boolean).map(l=>/^https?:\/\//i.test(l)?l:'https://'+l);
 const old=edK?E[edDate].find(x=>x.k===edK):null,mode=document.querySelector('input[name=tm]:checked').value,time=mode==='none'?null:($('#tv').value||null);
 try{if(!text&&!links.length&&!draft.length)await removeEntry();
 else{const en={k:edK||`${cur}|${edDate}|${Date.now()}`,pid:old?old.pid:cur,date:edDate,time,text,links,media:draft};
  await dbPut('entries',en);const L=E[edDate]||(E[edDate]=[]),i=L.findIndex(x=>x.k===en.k);i<0?L.push(en):L[i]=en}
 $('#ed').close();render()}catch(e){toast('儲存失敗，可能是檔案太大或空間不足')}}


/* ===== 備份與還原 ===== */
const LB='nyear-lastbackup';
const lastB=()=>{try{return +localStorage.getItem(LB)||0}catch(e){return 0}};
const markB=()=>{try{localStorage.setItem(LB,Date.now())}catch(e){}};
const b64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
let bkFile=null;
function openBk(){const t=lastB();$('#blast').textContent=t?'上次備份：'+new Date(t).toLocaleString('zh-TW'):'尚未備份過';
 $('#bst').textContent='';$('#bst2').textContent='';$('#bsave').style.display='none';bkFile=null;$('#bk').showModal()}
async function prepBackup(){
 const st=$('#bst');bkFile=null;$('#bsave').style.display='none';
 try{
  st.textContent='準備中…';
  const ps=await dbAll('people'),parts=['{"app":"nyear-diary","v":1,"at":'+JSON.stringify(new Date().toISOString())+',"people":'+JSON.stringify(ps)+',"entries":['];
  let n=0;
  for(const p of ps)for(const e of await dbByP(p.id)){
   const media=[];for(const m of e.media||[])media.push({t:m.t,n:m.n,y:m.b.type,d:await b64(m.b)});
   parts.push((n?',':'')+JSON.stringify({...e,media}));n++;st.textContent='準備中… '+n;
  }
  parts.push(']}');
  bkFile=new File(parts,'n-year-diary-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
  st.textContent=`完成：${ps.length} 位對象、${n} 則紀錄，約 ${(bkFile.size/1048576).toFixed(1)} MB。請按「儲存備份檔」。`;
  $('#bsave').style.display='';
 }catch(e){st.textContent='備份失敗：'+(e.message||e)}
}
function dl(f){const u=URL.createObjectURL(f),a=h('a',{href:u,download:f.name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function saveBackup(){
 if(!bkFile)return;
 try{
  if(navigator.canShare&&navigator.canShare({files:[bkFile]})){
   try{await navigator.share({files:[bkFile],title:'N年日記備份'})}catch(e){if(e.name==='AbortError')return;dl(bkFile)}
  }else dl(bkFile);
  markB();$('#blast').textContent='上次備份：'+new Date().toLocaleString('zh-TW');render();
  $('#bst').textContent='已送出。請確認檔案真的存到「檔案」App、雲端硬碟或其他安全的地方。';
 }catch(e){toast('無法儲存：'+(e.message||e))}
}
async function importBackup(f){
 const st=$('#bst2');
 try{
  st.textContent='讀取中…';
  const j=JSON.parse(await f.text());
  if(j.app!=='nyear-diary'||!Array.isArray(j.people)||!Array.isArray(j.entries))throw new Error('這不是 N年日記 的備份檔');
  for(const p of j.people)if(p&&p.id&&p.name)await dbPut('people',{id:String(p.id),name:String(p.name).slice(0,30)});
  let n=0;
  for(const e of j.entries){
   if(!e||!e.k||!e.pid||!/^\d{4}-\d{2}-\d{2}$/.test(e.date))continue;
   const media=[];
   for(const m of e.media||[]){if(!['image','video','audio'].includes(m.t)||!/^data:(image|video|audio)\//.test(m.d))continue;
    const b=await(await fetch(m.d)).blob();media.push({t:m.t,n:String(m.n||''),b:m.y?new Blob([b],{type:m.y}):b})}
   await dbPut('entries',{k:String(e.k),pid:String(e.pid),date:e.date,time:/^\d{2}:\d{2}$/.test(e.time)?e.time:null,text:String(e.text||''),
    links:(e.links||[]).map(String).filter(l=>/^https?:\/\//i.test(l)),media});
   n++;st.textContent=`匯入中… ${n}/${j.entries.length}`;
  }
  people=await dbAll('people');people.sort((a,b)=>a.id<b.id?-1:1);
  await sel(people.find(p=>p.id===cur)?cur:people[0]?.id||null);
  st.textContent=`匯入完成：${n} 則紀錄。`;
 }catch(e){st.textContent='匯入失敗：'+(e.message||e)}
}
$('#bf').onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=''};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
(async()=>{await openDB();people=await dbAll('people');people.sort((a,b)=>a.id<b.id?-1:1);await sel(people[0]?.id||null)})();
</script>
