body{margin:0;background:var(--bg);color:var(--ink);font:var(--f14)/1.7 "Cubic 11",sans-serif;letter-spacing:.04em}
/* Win95 字距／行距：參考舊 Windows 點陣字畫面——字貼字不加字距、行距收緊（Win7 不受影響） */
html:not(.w7) *{letter-spacing:0!important}
html:not(.w7) body,html:not(.w7) .dtt,html:not(.w7) #gd .gb{line-height:1.5}
main{max-width:720px;margin:0 auto;padding:18px 16px 100px}
h1{font:400 var(--f32) "Cubic 11",serif;letter-spacing:.1em;margin:0;text-align:center}
*{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
.card .txt,.card .txt *,#dtc .dtt,#dtc .dtt *{-webkit-user-select:text;user-select:text}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:var(--bw) solid transparent;background:var(--pxbg);border-radius:0;clip-path:var(--cut);padding:5px 12px;font-size:var(--f13)}
input:not([type=radio]):not([type=checkbox]):focus,select:focus,textarea:focus,.fl:focus-visible{--bd:var(--acx);outline:2px solid var(--acx);outline-offset:1px}
button:focus-visible:not(:disabled){outline:2px solid var(--acx);outline-offset:1px}
button:active:not(:disabled){--hi:var(--blo);--lo:var(--bhi)}
button.pri:focus,button.pri:active,button.tg.on:focus,button.tg.on:active,button#fab:focus,button#fab:active{--bd:var(--ink);outline-color:var(--acc)}
.dhead .arrow:focus,.dhead .arrow:active,.hmhead button:focus,.hmhead button:active{clip-path:none;outline:1px solid var(--acx);outline-offset:2px}
a:focus-visible{outline:2px solid var(--acx);outline-offset:2px}
.pri{--fill:var(--acc);--bd:var(--ink);color:var(--onacc);border-radius:0;clip-path:var(--cut)}
.prow{display:flex;align-items:center;gap:8px}


/* +／-按鈕固定在右側，不跟著對象、標籤滑動 */


.dhead{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:nowrap;margin:14px 0 12px}
.dgL,.dgR{display:flex;align-items:center;gap:6px;flex:none}.dgR{margin-left:auto}
@media (max-width:400px){.dhead .dgR .edit{padding:0 6px}.dhead .arrow{padding:0 5px}.dgL,.dgR{gap:3px}}
.dhead .edit{margin:0;height:32px;line-height:28px;padding:0 12px;box-sizing:border-box}
.dpick{position:relative}.dpick .dpin{position:absolute;inset:0;opacity:0;border:0;padding:0;margin:0;width:100%;height:100%;cursor:pointer}
.dhead .arrow{padding:0 9px;position:relative;color:transparent;border:none;background:none;clip-path:none}
.dhead .arrow::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:16px;transform:translate(-50%,-50%);background:var(--mute);-webkit-mask:var(--ar-l) center/contain no-repeat;mask:var(--ar-l) center/contain no-repeat}
.dhead .arrow[aria-label="後一天"]::after{-webkit-mask-image:var(--ar-r);mask-image:var(--ar-r)}
.who{font-size:var(--f13);font-weight:500;color:var(--acx);margin-bottom:2px}
.day{font:400 var(--f33)/1.2 "Cubic 11",serif;margin:0;flex:none;white-space:nowrap}.day .dn{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.sub{color:var(--mute);margin:0 0 22px}
.tl{margin-left:6px}
.row{position:relative;padding:0 0 26px 24px}
.row::before{content:"";position:absolute}
.row::after{content:"";position:absolute}
.row.has::after{background:var(--acc)}.row.has::before{}
.rh{display:flex;align-items:center;height:34px}.rh .radd{margin:0 0 0 auto;flex:none}.yr{font:400 var(--f22)/1 "Cubic 11",serif;letter-spacing:.1em;margin-right:8px}.ago{color:var(--mute);font-size:var(--f11);line-height:1}
.card{background:var(--frm);border:var(--bw) solid transparent;border-radius:0;margin-top:8px;clip-path:var(--stair);display:flex;flex-direction:column}
.cbody{overflow:hidden;position:relative;flex:1 1 auto}
.cbody.clip::after{pointer-events:none;content:'';position:absolute;left:0;right:0;bottom:0;height:1.6em;background:linear-gradient(to bottom,transparent,var(--card))}

.txt{white-space:pre-wrap;word-break:break-word;margin:0 0 6px}.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
mark{padding:0 2px}
.media{display:grid;grid-template-columns:repeat(auto-fill,72px);gap:8px;margin:8px 0}
.th{clip-path:var(--cut);position:relative;width:72px;height:72px;border-radius:0;overflow:hidden;cursor:zoom-in;background:#0004;border:var(--bw) solid var(--ink)}.th img,.th video{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:var(--f20);background:#0003;pointer-events:none}
.media audio{grid-column:1/-1;width:100%;height:34px}
.links a{display:block;color:var(--hotx,var(--acx));word-break:break-all;font-size:var(--f13)}
.edit{font-size:var(--f12);margin-top:8px;color:var(--mute)}
dialog{border:var(--bw) solid transparent;border-radius:0;background:var(--frm);color:var(--ink);width:min(560px,92vw);padding:21px;clip-path:none}
dialog::backdrop{background:#0008}
dialog:focus,dialog:focus-visible{outline:none}
dialog h2{font:600 var(--f18) "Cubic 11",serif;letter-spacing:.1em;margin:0 0 12px}
dialog input[type=text]{--fill:var(--card);clip-path:var(--cut);width:100%;border:var(--bw) solid transparent;background:var(--pxbg);border-radius:0;padding:6px 9px;margin-bottom:10px}
textarea{--fill:var(--card);--bd:var(--ink);clip-path:var(--cut);width:100%;border:var(--bw) solid transparent;background:var(--pxbg);border-radius:0;padding:7px 10px;margin-bottom:10px}
label{display:block;font-size:var(--f14);color:var(--mute)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.acts.end{justify-content:flex-end;margin-top:16px}
.more{display:block;margin:0 auto}
#toast{position:fixed;inset:auto;margin:0;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border:0;border-radius:0;clip-path:var(--cut);max-width:90vw;z-index:9}
.note{clip-path:var(--cut);background:var(--hotbg,var(--soft));border-radius:0;padding:8px 12px;font-size:var(--f14);margin-bottom:12px}

.hs{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px 2px 8px;margin:0 -2px}.hs+.hs{margin-top:6px;padding-top:14px;border-top:1px solid var(--line);opacity:1}
.hs>.card{flex:0 0 auto;width:fit-content;min-width:min-content;max-width:min(260px,78%);margin-top:0}.hs>.card.wide{max-width:min(320px,88%)}.hs>.card.hasm,.hs>.card:has(.qv){min-width:min(260px,78%)}
.hi{flex:0 0 auto;width:fit-content;min-width:min-content;max-width:min(260px,78%);position:relative;padding-top:34px}.hi.wide{max-width:min(320px,88%)}.hi:has(.card.hasm),.hi:has(.card .qv){min-width:min(260px,78%)}.hi>.card{margin-top:0}
.hi::before{content:"";position:absolute;left:-6px;right:-6px}
.hi:first-child::before{left:0}.hi:last-child::before{right:0}
.htm::after{content:"";position:absolute;left:50%;transform:translateX(-50%)}
.htm{position:absolute;left:0;top:0;font:400 var(--f12)/18px "Cubic 11",serif;color:var(--acc)}

.xb[hidden],.cx[hidden]{display:none}
.cbody.hm{max-height:130px}.cbody.hm.clip::after{display:none}.card:not(.open) .cbody.hm .txt:not(.hlc){display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;line-clamp:1;overflow:hidden}
.card.open .cbody{max-height:none}.card.open .cbody.clip::after{display:none}
.lh{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 6px}.lh .edit{margin:0}
.r{display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
input[type=radio],input[type=checkbox]{accent-color:var(--acc)}
#tv,#mvtv{--fill:var(--card);clip-path:var(--cut);border:var(--bw) solid transparent;background:var(--pxbg);border-radius:0}#tv:disabled,#mvtv:disabled{opacity:.4}
#dl{margin-right:auto}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;--fill:var(--acc);--bd:var(--ink);color:var(--onacc);padding:11px 18px;margin:0;font-size:var(--f14);font-weight:500}
#fab[hidden]{display:none}

/* 標題列（瀏海）：框線背景跟著內容一起捲動 */
dialog{background-attachment:local}

dialog.tbd{--tt:36px;padding-top:calc(var(--tt) + 6px)}

dialog.tbd>.eth:is(:first-child,.sbw+.eth){position:absolute;left:8px;right:32px;top:4px;height:24px;margin:0;padding:0;gap:8px}

#dt{padding:36px 4px 4px;overflow:hidden;background-attachment:scroll}
/* 標題列（瀏海）固定：只有下方內容區在捲動 */
#dts{flex:1 1 auto;min-height:0;margin-bottom:2px;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none}
#dtt{position:absolute;left:8px;right:64px;top:4px;height:24px;font:400 var(--f16)/24px "Cubic 11",serif;letter-spacing:.1em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dtc>.dth{display:none}
.card{--tt:5px;padding:12px 14px}

/* 整理的紀錄方塊：和視窗一樣有標題列（瀏海），日期放在標題列上 */
.wc{--tt:36px;padding:0;overflow:hidden;background-attachment:scroll}
.wcs{position:absolute;left:0;right:0;top:46px;bottom:0;padding:0 21px 11px;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.wc>.dth{position:absolute;left:8px;right:8px;top:4px;height:24px;margin:0;font:400 var(--f16)/24px "Cubic 11",serif;letter-spacing:.1em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc.wdone{--tt:5px;padding:21px;overflow:visible}
/* 標籤：不要框線，長相同「對象／標籤」標示（顏色跟著目前對象），字比標示大一點點 */
.tg,.dtg,.card .tg{border:0;border-radius:0;clip-path:var(--stair);background:var(--hotbg,var(--soft));color:var(--hotx,var(--acx));font-weight:500;padding:0 8px;white-space:nowrap}
.tg.add{color:var(--mute)}.tg.del{color:var(--del)}.tg.on{background:var(--acc);color:var(--onacc)}
/* 紀錄方塊按下去的效果：內部填色變深（比照按鈕按下） */
.card[data-k]:active:not(:has(button:active)):not(:has(a:active)){--pp:var(--btnf);--pp:color-mix(in srgb,var(--card) 88%,var(--ink))}
/* 紀錄方塊（參考掌機簡訊清單）：階梯切角＋2px 深色外框＋內側淺線＋底色，內文與按鈕之間有分隔線。未展開＝淡色底＋白線；展開＝白底＋淡色線（互為對比） */
.card:not(.empty){--ca:var(--bg);position:relative;border:0;margin-bottom:36px;clip-path:none;background:var(--ca);box-shadow:inset 2px 2px 0 var(--blo),inset -2px -2px 0 var(--bhi)}
.card:not(.empty) .cbody.clip::after{background:linear-gradient(to bottom,transparent,var(--ca))}
/* 按鈕與淺色小字放在方塊外面（方塊正下方） */
.card:not(.empty) .ea{position:absolute;left:0;right:0;top:calc(100% + 6px);margin:0}
.card:not(.empty) .ea>.edit{margin:0}
.card[data-k]:not(.empty):active:not(:has(button:active)):not(:has(a:active)){--ca:var(--btnf)}
@supports (color:color-mix(in srgb,red,blue)){.card[data-k]:not(.empty):active:not(:has(button:active)):not(:has(a:active)){--ca:color-mix(in srgb,var(--bg) 88%,var(--ink))}}
/* 圖檔：同樣內凹（左上深、右下淺），不用黑框 */
.th,.dtm{border:2px solid;border-color:var(--blo) var(--bhi) var(--bhi) var(--blo);clip-path:none}
/* 未點開的方塊底色淺一點；按下去的瞬間變回原本的主題色① */
@supports (color:color-mix(in srgb,red,blue)){.card:not(.empty){--ca:color-mix(in srgb,var(--bg) 55%,var(--card))}}
.card[data-k]:not(.empty):not(.open):active:not(:has(button:active)):not(:has(a:active)){--ca:var(--bg)}

button,input:not([type=radio]):not([type=checkbox]):not([type=range]):not([type=color]):not([type=file]),textarea,select,#q,#qs2,.fl,.qhit,.qv,.qchip,.dtg,#tv,#mvtv{--bw:1px}

#qp{position:absolute;left:4px;right:4px;top:100%;z-index:3;max-height:calc(100dvh - var(--hdr,120px) - 16px);overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border:1px solid var(--ink);box-shadow:inset 1px 1px 0 var(--bhi),inset -1px -1px 0 var(--blo),1px 1px 0 var(--ink);padding:6px 10px 8px}#qp[hidden]{display:none}

.ap{--f:0;display:flex;flex-direction:column;gap:6px;padding:6px;width:100%;min-width:0;background:var(--bg);box-shadow:inset 1px 1px 0 var(--bhi),inset -1px -1px 0 var(--blo),0 0 0 1px var(--ink);box-sizing:border-box}

html .htm::after,html.w7 .htm::after{display:block;left:50%;top:100%;width:1px;height:8px;transform:translateX(-50%);clip-path:none;border-radius:0;box-shadow:none;background:var(--ink)}
html.w7 .htm::after{background:#8A8A8A}
/* Win95 時刻下的直線：比照時間軸的凹槽線（深線＋白色亮線） */
html:not(.w7) .htm::after{width:4px;height:6px;background:linear-gradient(to right,var(--blo) 0 1px,var(--ink) 1px 2px,var(--btnf) 2px 3px,var(--bhi) 3px 4px)}
/* Win7 時間軸線：不用有框的凹槽，改成和時刻直線一樣的細實線（年份軸 1.5px、當日 1px） */
html.w7 .tl{background:linear-gradient(#8A8A8A,#8A8A8A) 1.25px 0/1.5px 100% no-repeat}
html.w7 .hi::before{top:25px;height:1px;background:#8A8A8A}
.rh .yr{position:relative;z-index:0;margin-left:-34px;padding:0 6px 1px;line-height:1.05}
.rh .yr::before,.htm::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:var(--hlt);bottom:0;background:var(--bg)}
.row.has .rh .yr::before,.htm::before{background:var(--hlbg);box-shadow:var(--hlsh)}
.row.has .rh .yr{text-shadow:none}
/* 時刻：方塊與字同高、字置中不超出（年份維持字頂超出） */
.htm{z-index:0;padding:0 5px;line-height:17px;color:var(--ink)}.htm::before{top:0}
/* 標籤（Win95）：實色銳角方塊、字不超出、置中 */
html:not(.w7) :is(.tg,.dtg,.card .tg){clip-path:none;display:inline-flex;align-items:center;justify-content:center;text-align:center;box-shadow:var(--hlsh);margin:0 1px 1px 0}
html:not(.w7) :is(.tg,.dtg,.card .tg):not(.on){background:color-mix(in srgb,var(--acc) 16%,var(--card))}

/* 開機畫面：Win95 主題1 的主題色①（#C0C0C0）、內凹框圖標＋標題＋進度條（參考 Win95 安裝程式）；跑完後進度條的位置換成「開始記錄」按鈕。兩種風格都一樣 */
#boot{position:fixed;inset:0;z-index:2147483647;background:#C0C0C0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Cubic 11",monospace;color:#000;letter-spacing:0}

#boot .bgo:active{box-shadow:inset 1px 1px 0 #000000,inset -1px -1px 0 #FFFFFF,inset 2px 2px 0 #808080,inset -2px -2px 0 #DFDFDF;padding-top:2px;padding-left:18px}
#boot .bgo:focus-visible{outline:1px dotted #000;outline-offset:-5px}

#boot .bs{visibility:hidden;margin-top:14px;display:flex;align-items:center;gap:12px;font-size:14.6667px}#boot .bs label{display:inline-flex;align-items:center;gap:4px;margin:0;font-size:14.6667px;color:#000}#boot.ready .bs{visibility:visible}

/* 開機畫面的單選鈕：不論風格都用 Win95 樣式 */
#boot input[type=radio]{-webkit-appearance:none;appearance:none;position:relative;flex:none;width:16px;height:16px;margin:0 2px 0 0;padding:0;border:0;border-radius:0;background:linear-gradient(135deg,#808080 0 50%,#FFFFFF 50% 100%);clip-path:polygon(5px 0px,11px 0px,11px 1px,13px 1px,13px 2px,14px 2px,14px 3px,15px 3px,15px 4px,15px 5px,16px 5px,16px 6px,16px 7px,16px 8px,16px 9px,16px 10px,16px 11px,15px 11px,15px 12px,15px 13px,14px 13px,14px 14px,13px 14px,13px 15px,11px 15px,11px 16px,5px 16px,5px 15px,3px 15px,3px 14px,2px 14px,2px 13px,1px 13px,1px 12px,1px 11px,0px 11px,0px 10px,0px 9px,0px 8px,0px 7px,0px 6px,0px 5px,1px 5px,1px 4px,1px 3px,2px 3px,2px 2px,3px 2px,3px 1px,5px 1px,5px 0px);vertical-align:-3px}
#boot input[type=radio]::before{content:"";display:block;position:absolute;inset:2px;background:#FFFFFF;clip-path:polygon(4px 0px,8px 0px,8px 1px,10px 1px,10px 2px,11px 2px,11px 3px,11px 4px,12px 4px,12px 5px,12px 6px,12px 7px,12px 8px,11px 8px,11px 9px,11px 10px,10px 10px,10px 11px,8px 11px,8px 12px,4px 12px,4px 11px,2px 11px,2px 10px,1px 10px,1px 9px,1px 8px,0px 8px,0px 7px,0px 6px,0px 5px,0px 4px,1px 4px,1px 3px,1px 2px,2px 2px,2px 1px,4px 1px,4px 0px)}

</style><span class="bi"><img src="icon-192.png" alt=""></span><div class="bt">Htbu_?</div><div class="bw"><div class="bb"><i id="bootb"></i></div><div class="bp" id="bootp">0%</div><button class="bgo" id="bootgo" type="button">開始記錄</button></div><div class="bs" id="boots"><span>音效</span><label class="r"><input type="radio" name="bsnd" value="1"> 開啟</label><label class="r"><input type="radio" name="bsnd" value="0"> 關閉</label></div></div>
<script>
/* 進度：主程式各階段設定目標值，畫面一格一格（整數 %）往上跑；到 100% 後換成「開始記錄」按鈕，按下才進入 */
(function(){var cur=0,tgt=8,done=false,B=document.getElementById('boot'),b=document.getElementById('bootb'),p=document.getElementById('bootp'),g=document.getElementById('bootgo');
 function draw(){b.style.width=cur+'%';p.textContent=cur+'%'}
 function tick(){if(cur<tgt){cur+=Math.max(1,Math.round((tgt-cur)/6));if(cur>tgt)cur=tgt;draw()}
  if(cur>=100&&done){setTimeout(function(){B.classList.add('ready')},150);return}
  setTimeout(tick,40)}
 var out=function(){B.classList.add('out')};
 /* 還沒有任何對象（第一次使用）：先問要不要看功能介紹；看完按 × 才進主畫面 */
 /* 詢問與功能介紹一律用 Win95 樣式：Win7 時先暫時切回 Win95（開機畫面擋在後面看不到），結束後再切回來 */
 g.onclick=function(){if(typeof people!=='undefined'&&!people.length&&typeof ask==='function'){var de=document.documentElement,w7=de.classList.contains('w7');
   if(w7){de.classList.remove('w7');try{applyTheme(null)}catch(e){}}
   var back=function(){if(w7){de.classList.add('w7');try{applyTheme(multi?REVCOL:pById(cur)?.color);if(typeof sbRefresh==='function')sbRefresh()}catch(e){}}},fin=function(){back();out()};
   /* × ＝回到開機畫面（不進主畫面）；是＝看功能介紹；否＝直接進主畫面 */
   ask('之後都可以在選單內瀏覽','是否觀看功能介紹？','是','否',true).then(function(y){if(y===null)back();else if(y)openGd(0,{intro:fin});else fin()})}else out()};
 /* 音效開關：比照功能設定；主程式已載入就直接改設定，否則先寫進 localStorage */
 var on=true;try{var f=JSON.parse(localStorage.getItem('nyear-feat')||'{}');if(f.sound===false)on=false}catch(e){}
 document.querySelector('#boots input[value="'+(on?1:0)+'"]').checked=true;
 document.querySelectorAll('#boots input').forEach(function(r){r.onchange=function(){var v=r.value==='1';
  if(typeof setFeat==='function')setFeat('sound',v);else{try{var f=JSON.parse(localStorage.getItem('nyear-feat')||'{}');f.sound=v;localStorage.setItem('nyear-feat',JSON.stringify(f))}catch(e){}}}});
 window.bootP=function(n){tgt=Math.max(tgt,Math.min(100,n));if(n>=100)done=true};
 setTimeout(function(){if(!done)window.bootP(100)},8000);/* 保險：最多 8 秒 */
 draw();tick()})();
</script>

<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const pById=id=>people.find(p=>p.id===id),ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
/* 開啟視窗：套用標題列按鈕、鎖住背景；開啟後不自動聚焦裡面的欄位或按鈕（避免跳出鍵盤或框住按鈕） */
{const sm=HTMLDialogElement.prototype.showModal;HTMLDialogElement.prototype.showModal=function(){if(window.decoDlg)decoDlg(this);if(window.wrLock)wrLock(true);sm.call(this);
 let a=document.activeElement;if(a&&a!==document.body&&this.contains(a)&&a.matches('input,textarea,select,button'))a.blur();
 if(window.sbRefresh)sbRefresh();a=document.activeElement;if(a&&this.contains(a)&&(a.tagName==='BUTTON'||(a.tagName==='INPUT'&&a.type==='radio'))){a.blur();this.tabIndex=-1;this.focus({preventScroll:true})}}}
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a)k.startsWith('on')?e[k]=a[k]:e.setAttribute(k,a[k]);e.append(...c.flat().filter(x=>x!=null&&x!==false));return e};
let hmY=null,hmData=[],hmPid=null;
let MINY=+localStorage.getItem('nyear-miny')||null;
const FK='nyear-feat',FEAT={people:true,tags:true,time:true,quote:true,md:true,sound:true};
try{Object.assign(FEAT,JSON.parse(localStorage.getItem(FK)||'{}'))}catch(e){}
/* 對象、標籤、時間、引用一律開啟（不再提供開關） */
Object.assign(FEAT,{people:true,tags:true,time:true,quote:true});
const saveFeat=()=>{try{localStorage.setItem(FK,JSON.stringify(FEAT))}catch(e){}};
let db,useMem=false,M={people:{},entries:{},dumps:{}},people=[],cur=null,E={},urls=[],extra=0,hy=null,multi=false,msel=new Set(),edDate=null,edK=null,draft=[],durls=[],dturls=[],dtags=[],dquote=[],qs='',ftags=[],rlim=50,qt,other=false,srch=false,sf={types:new Set(),pids:new Set(),tags:new Set(),d1:'',d2:''};
const NODATE='0000-00-00',tsOf=e=>+String(e.k).split('|').pop()||0;
const now=new Date();let mo=now.getMonth()+1,dy=now.getDate();

/* win＝有標題列（瀏海）的視窗外框：沒有標題文字與 −；右上 × 回傳 null（關掉、不選是或否） */
function ask(sub,title,yes,no,win){return new Promise(res=>{const d=$('#cf'),s=$('#cfs');d.classList.toggle('tbd',!!win);let x=d.querySelector('.xcl');if(x)x.remove();if(win){x=h('button',{class:'xcl','aria-label':'關閉',onclick:()=>fin(null)});d.prepend(x)}$('#cft').textContent=title||'是否刪除？';$('#cfy').textContent=yes||'確定';$('#cfn').textContent=no||'取消';s.textContent=sub||'';s.hidden=!sub;let done=false;
 const fin=v=>{if(done)return;done=true;if(d.open)d.close();d.classList.remove('tbd');if(x)x.remove();res(v)};
 $('#cfy').onclick=()=>fin(true);$('#cfn').onclick=()=>fin(false);d.onclose=()=>fin(false);d.showModal()})}
async function clr(id){const e=$(id);if(e.value&&await ask('','是否清除？'))e.value=''}
function toast(t){const e=$('#toast');e.textContent=t;if(!e.matches(':popover-open'))e.showPopover();clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidePopover(),3500)}
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('nyear-diary',2);
q.onupgradeneeded=()=>{const d=q.result,has=n=>d.objectStoreNames.contains(n);if(!has('people'))d.createObjectStore('people',{keyPath:'id'});if(!has('entries'))d.createObjectStore('entries',{keyPath:'k'}).createIndex('pid','pid');if(!has('dumps'))d.createObjectStore('dumps',{keyPath:'k'})};
q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>{useMem=true;r()}}catch(e){useMem=true;r()}})}
const req=(st,mode,f)=>new Promise((res,rej)=>{const t=db.transaction(st,mode);const r=f(t.objectStore(st));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
const dbAll=st=>useMem?Promise.resolve(Object.values(M[st])):req(st,'readonly',s=>s.getAll());
const dbPut=(st,v)=>useMem?(M[st][v.id||v.k]=v,Promise.resolve()):req(st,'readwrite',s=>s.put(v));
const dbDel=(st,k)=>useMem?(delete M[st][k],Promise.resolve()):req(st,'readwrite',s=>s.delete(k));
const dbByPAll=id=>useMem?Promise.resolve(Object.values(M.entries).filter(e=>e.pid===id)):req('entries','readonly',s=>s.index('pid').getAll(id));
const dbByP=id=>dbByPAll(id).then(a=>a.filter(e=>!e.archived));

/* 載入目前畫面的紀錄：先放進自己的暫存，最後才換上；同時有兩次載入（例如打字搜尋和勾篩選幾乎同時）時，只採用最新那次，避免同一則被加兩次 */
let lvN=0;
async function loadView(){const my=++lvN,X={},seen=new Set(),add=e=>{if(seen.has(e.k))return;seen.add(e.k);(X[e.date]||(X[e.date]=[])).push(e)};
 let qx=null;try{qx=new Map((await dbAll('entries')).filter(e=>!e.archived).map(e=>[e.k,e]))}catch(_){}
 if(srch){for(const id of sf.pids)(await dbByP(id)).forEach(e=>{if(sf.types.has(e.date===NODATE?'note':'tl'))add(e)})}
 else{const ids=multi?[...msel]:cur?[cur]:[];for(const id of ids)(await dbByP(id)).forEach(e=>{if((e.date===NODATE)===other)add(e)})}
 if(my!==lvN)return;/* 已經有更新的載入，這次的結果丟掉 */
 if(qx)QX=qx;E=X}
async function sel(id){cur=id;multi=false;srch=false;qs='';$('#q').value='';qpClose();document.documentElement.classList.remove('rvm');drawMbar();hy=null;extra=0;ftags=[];rlim=50;applyTheme(pById(id)?.color);await loadView();render()}
async function toggleMulti(){multi=!multi;srch=false;qs='';$('#q').value='';qpClose();if(multi){other=false;msel=new Set(people.map(p=>p.id))}hy=null;ftags=[];document.documentElement.classList.toggle('rvm',multi);if(multi)closeMenu();drawMbar();applyTheme(multi?REVCOL:pById(cur)?.color);await loadView();render()}
async function toggleOther(){
 if(!other&&!cur)return;
 other=!other;if(other)multi=false;srch=false;qpClose();hy=null;ftags=[];qs='';$('#q').value='';rlim=50;
 applyTheme(pById(cur)?.color);await loadView();render()}
async function tog(id){msel.has(id)?msel.delete(id):msel.add(id);ftags=ftags.filter(x=>msel.has(x.pid));await loadView();render()}
async function addP(){const n=$('#pn').value.trim();if(!n)return;const p={id:'p'+Date.now(),name:n};await dbPut('people',p);people.push(p);$('#pn').value='';pd.close();sel(p.id)}
/* 編輯／刪除對象：只針對目前的對象 */
let peMode='edit',peId=null;
function openPe(mode){if(!people.some(p=>p.id===cur))return;peMode=mode==='del'?'del':'edit';peId=cur;
 $('#pet').textContent=peMode==='del'?'刪除對象':'編輯對象';$('#peo').textContent=peMode==='del'?'刪除':'儲存';
 $('#penw').hidden=$('#peaw').hidden=peMode==='del';$('#pesw').hidden=peMode!=='del';
 /* 刪除對象：比照刪除標籤，先選要刪除的對象（預設＝目前對象） */
 if(peMode==='del'){rc($('#pes'),...people.map(p=>h('option',{value:p.id},p.name)));$('#pes').value=peId;$('#pes').onchange=()=>{peId=$('#pes').value}}$('#pen').value=pname(peId);peAvLoad(peId);
 pe.showModal();if(peMode==='edit'){$('#pen').focus();$('#pen').select()}}
/* 頭貼編輯：選圖後在圓框裡拖曳、縮放；儲存時裁成 256×256 */
let peAv=null;
const avAcc=P=>colInfo(P&&P.color)?.acc||defAcc();
function avEl(P,size,cls){const d=h('div',{class:'av'+(cls?' '+cls:''),style:`width:${size}px;height:${size}px;background:${P&&P.avc||avAcc(P)}`});if(P&&P.av)d.append(h('img',{src:P.av,alt:''}));return d}
function peAvLoad(id){const P=pById(id);peAv={P,mode:P&&P.av?'img':P&&P.avc?'color':null,color:P&&P.avc||avAcc(P),img:null,z:1,cx:0,cy:0,dirty:false};
 if(peAv.mode==='img'){const i=new Image();i.onload=()=>{peAv.img=i;peAv.cx=i.naturalWidth/2;peAv.cy=i.naturalHeight/2;peAvDraw()};i.src=P.av}
 $('#peac').value=String(peAv.color).toLowerCase().startsWith('#')?String(peAv.color).toLowerCase():'#000080';$('#peaz').value=1;peAvDraw()}
/* 裁切框（頭貼、週dump背景共用）：圖片鋪滿框、可縮放（z）與拖曳（cx,cy＝框中心對到的圖片座標） */
function cropGeo(S,fw,fh){const im=S.img,iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height,s=Math.max(fw/iw,fh/ih)*S.z,vw=fw/s,vh=fh/s;
 S.cx=Math.min(iw-vw/2,Math.max(vw/2,S.cx));S.cy=Math.min(ih-vh/2,Math.max(vh/2,S.cy));return{fw,fh,iw,ih,s,vw,vh}}
function cropPlace(i,S,g){Object.assign(i.style,{width:g.iw*g.s+'px',height:g.ih*g.s+'px',left:(g.fw/2-S.cx*g.s)+'px',top:(g.fh/2-S.cy*g.s)+'px'})}
function cropDrag(F,get,geo,draw){let st=null;
 F.addEventListener('pointerdown',e=>{const S=get();if(!S)return;st={x:e.clientX,y:e.clientY,cx:S.cx,cy:S.cy};F.setPointerCapture(e.pointerId)});
 F.addEventListener('pointermove',e=>{if(!st)return;const S=get(),g=geo();S.cx=st.cx-(e.clientX-st.x)/g.s;S.cy=st.cy-(e.clientY-st.y)/g.s;draw()});
 ['pointerup','pointercancel'].forEach(t=>F.addEventListener(t,()=>{st=null}))}
function peAvGeo(){const F=$('#peaf').clientWidth||96;return cropGeo(peAv,F,F)}
function peAvDraw(){const f=$('#peaf'),i=$('#peai'),img=peAv&&peAv.mode==='img'&&peAv.img;f.style.background=peAv&&peAv.mode==='color'?peAv.color:avAcc(peAv&&peAv.P);
 $('#peaz').disabled=!img;i.hidden=!img;if(!img)return;const g=peAvGeo();i.src=img.src;cropPlace(i,peAv,g)}
function peAvSet(mode){if(!peAv)return;peAv.mode=mode;peAv.dirty=true;if(mode===null)$('#peac').value=String(avAcc(peAv.P)).toLowerCase().startsWith('#')?avAcc(peAv.P).toLowerCase():'#000080';peAvDraw()}
$('#peac').addEventListener('input',()=>{if(!peAv)return;peAv.color=$('#peac').value;peAvSet('color')});
$('#peaz').oninput=()=>{if(peAv){peAv.z=+$('#peaz').value;peAv.dirty=true;peAvDraw()}};
$('#peaf2').onchange=()=>{const f=$('#peaf2').files&&$('#peaf2').files[0];$('#peaf2').value='';if(!f||!peAv)return;const u=URL.createObjectURL(f),i=new Image();
 i.onload=()=>{peAv.img=i;peAv.z=1;$('#peaz').value=1;peAv.cx=i.naturalWidth/2;peAv.cy=i.naturalHeight/2;peAvSet('img')};i.onerror=()=>toast('無法讀取這張圖片');i.src=u};
cropDrag($('#peaf'),()=>peAv&&peAv.mode==='img'&&peAv.img?peAv:null,peAvGeo,()=>{peAv.dirty=true;peAvDraw()});
function peAvOut(){if(!peAv||peAv.mode!=='img'||!peAv.img)return null;const g=peAvGeo(),c=document.createElement('canvas');c.width=c.height=256;
 c.getContext('2d').drawImage(peAv.img,peAv.cx-g.vw/2,peAv.cy-g.vw/2,g.vw,g.vw,0,0,256,256);return c.toDataURL('image/jpeg',.86)}

async function delP(id){const P=pById(id);if(!P)return;pe.close();if(!await ask(`「${P.name}」與全部紀錄都會被刪除`))return;

 if(id===cur)await sel(people[0]?.id||null);else render()}

const mu=(m,l=urls)=>{const u=URL.createObjectURL(m.b);l.push(u);return u};
function shot(v){const W=480,vw=v.videoWidth||W,vh=v.videoHeight||W,r=Math.min(1,W/vw),c=document.createElement('canvas');c.width=Math.max(1,Math.round(vw*r));c.height=Math.max(1,Math.round(vh*r));
 try{c.getContext('2d').drawImage(v,0,0,c.width,c.height)}catch(e){return Promise.resolve(null)}
 return new Promise(res=>c.toBlob(res,'image/jpeg',.8))}
function mkPoster(b){return new Promise(res=>{const u=URL.createObjectURL(b),v=document.createElement('video');let done=false;
 const fin=r=>{if(done)return;done=true;URL.revokeObjectURL(u);res(r)};
 v.muted=true;v.playsInline=true;v.preload='auto';v.onerror=()=>fin(null);
 v.onloadedmetadata=()=>{v.currentTime=Math.min(.5,(v.duration||1)/2)};
 v.onseeked=()=>shot(v).then(fin);v.src=u;setTimeout(()=>fin(null),8000)})}
function toCover(f){return new Promise(res=>{const u=URL.createObjectURL(f),i=new Image();
 i.onload=()=>{const r=Math.min(1,480/i.naturalWidth),c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*r);c.height=Math.round(i.naturalHeight*r);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(res,'image/jpeg',.85)};

   if(dx>ax||dy>ay)continue;
   const d=Math.hypot(dx,dy);if(d<bd){bd=d;best=b}}
  if(!best)return;
  e.preventDefault();e.stopPropagation();
  best.classList.add('tapfx');setTimeout(()=>best.classList.remove('tapfx'),130);best.click()
 },true);
 const vv=window.visualViewport,de=document.documentElement;
 if(vv){const upd=()=>{const kb=innerHeight-vv.height>120;de.classList.toggle('kb',kb);
   if(kb){de.style.setProperty('--vvh',vv.height+'px');de.style.setProperty('--vvt',vv.offsetTop+'px')}else{de.style.removeProperty('--vvh');de.style.removeProperty('--vvt')}};
  const rf=()=>{upd();track()};vv.addEventListener('resize',rf);vv.addEventListener('scroll',rf)}
 addEventListener('focusin',e=>{const t=e.target;if(!t.matches||!t.matches('input:not([type=radio]):not([type=checkbox]):not([type=range]),textarea,select'))return;
  setTimeout(()=>{try{t.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}},350)});
}catch(e){}})();
