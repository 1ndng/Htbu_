body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 "Cubic 11","BaDing",sans-serif;letter-spacing:.04em}
main{max-width:720px;margin:0 auto;padding:18px 16px 100px}
h1{font:400 31px "BaDing","Cubic 11",serif;letter-spacing:.1em;margin:0;text-align:center}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:2px solid var(--ink)}.top>:first-child{justify-self:start}.top>:last-child{justify-self:end}
*{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
.card .txt,.card .txt *,#dtc .dtt,#dtc .dtt *{-webkit-user-select:text;user-select:text}
button,input,textarea,select{font:inherit;color:inherit}
button{--pxc:3px;cursor:pointer;border:var(--bw) solid transparent;background:var(--pxbg);border-radius:0;clip-path:var(--cut);padding:5px 12px;font-size:13px}
input:not([type=radio]):not([type=checkbox]):focus,select:focus,textarea:focus,.fl:focus-visible{--bd:var(--acx);outline:2px solid var(--acx);outline-offset:1px}
button:focus-visible:not(:disabled){outline:2px solid var(--acx);outline-offset:1px}
button:active:not(:disabled){--hi:var(--blo);--lo:var(--bhi)}
button.pri:focus,button.pri:active,button.chip.on:focus,button.chip.on:active,button.tg.on:focus,button.tg.on:active,button#fab:focus,button#fab:active{--bd:var(--acc);outline-color:var(--acc)}
.dhead .arrow:focus,.dhead .arrow:active,.hmhead button:focus,.hmhead button:active{clip-path:none;outline:1px solid var(--acx);outline-offset:2px}
a:focus-visible{outline:2px solid var(--acx);outline-offset:2px}
.pri{--pxc:3px;--fill:var(--acc);--bd:var(--acc);color:var(--onacc);border-radius:0;clip-path:var(--cut)}
.prow{display:flex;align-items:center;gap:8px}
#pplrow{margin:-3px -3px 17px}
#ppl{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;padding:3px;min-width:0;flex:1}#ppl::-webkit-scrollbar{display:none}
/* +／-按鈕固定在右側，不跟著對象、標籤滑動 */
.rx{display:flex;flex:none;gap:8px;padding:3px 3px 3px 0}.rx:empty{display:none}
.chip{--pxc:3px;border-radius:0;clip-path:var(--cut);flex:none;white-space:nowrap;font-size:14px;line-height:25.5px;padding:1px 12px}.chip.on{--fill:var(--acc);--bd:var(--acc);color:var(--onacc)}.chip.add{color:var(--mute)}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:nowrap;margin:14px 0 12px}
.dgL,.dgR{display:flex;align-items:center;gap:6px;flex:none}
.dhead .edit{margin:0;height:32px;line-height:28px;padding:0 12px;box-sizing:border-box}
.dpick{position:relative}.dpick .dpin{position:absolute;inset:0;opacity:0;border:0;padding:0;margin:0;width:100%;height:100%;cursor:pointer}
.dhead .arrow{padding:0 9px;position:relative;color:transparent;border:none;background:none;clip-path:none}
.dhead .arrow::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:16px;transform:translate(-50%,-50%);background:var(--mute);-webkit-mask:var(--ar-l) center/contain no-repeat;mask:var(--ar-l) center/contain no-repeat}
.dhead .arrow[aria-label="後一天"]::after{-webkit-mask-image:var(--ar-r);mask-image:var(--ar-r)}
.who{font-size:13px;font-weight:500;color:var(--acx);margin-bottom:2px}
.day{font:400 33px/1.2 "Cubic 11","BaDing",serif;margin:0;flex:none;white-space:nowrap}.day .dn{text-decoration:underline;text-decoration-color:var(--mute);text-decoration-thickness:2px;text-underline-offset:4px}
.sub{color:var(--mute);margin:0 0 22px}
@media (max-width:370px){.day,.otl{font-size:30px}}
.tl{border-left:2px solid var(--acx);margin-left:6px}
.row{position:relative;padding:0 0 26px 24px}
.row::before{content:"";position:absolute;left:-1px;top:9px;width:16px;height:16px;background:var(--acx);clip-path:var(--dot16);transform:translateX(-50%)}
.row::after{content:"";position:absolute;left:-1px;top:11px;width:12px;height:12px;background:var(--bg);clip-path:var(--dot12);transform:translateX(-50%)}
.row.has::after{background:var(--acx)}.row.has::before{background:var(--acx)}
.rh{display:flex;align-items:center;height:34px}.rh .radd{margin:0 0 0 auto;flex:none}.yr{font:600 21px/1 "BaDing",serif;letter-spacing:.1em;margin-right:8px}.ago{color:var(--mute);font-size:14px;line-height:1}
.card{--pxc:4px;background:var(--frm);border:var(--bw) solid transparent;border-radius:0;padding:12px 14px;margin-top:8px;clip-path:var(--stair);display:flex;flex-direction:column}
.cbody{max-height:4.9em;overflow:hidden;position:relative;flex:1 1 auto}
.cbody.clip::after{pointer-events:none;content:'';position:absolute;left:0;right:0;bottom:0;height:1.6em;background:linear-gradient(to bottom,transparent,var(--card))}
.card.empty{background:transparent;border:0;clip-path:none;color:var(--mute);display:flex;flex-direction:row;justify-content:flex-start;align-items:flex-start;gap:8px;padding:0}
.txt{white-space:pre-wrap;word-break:break-word;margin:0 0 6px}.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.media{display:grid;grid-template-columns:repeat(auto-fill,72px);gap:8px;margin:8px 0}
.th{--pxc:3px;clip-path:var(--cut);position:relative;width:72px;height:72px;border-radius:0;overflow:hidden;cursor:zoom-in;background:#0004;border:var(--bw) solid var(--line)}.th img,.th video{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;background:#0003;pointer-events:none}
.media audio{grid-column:1/-1;width:100%;height:34px}
.links a{display:block;color:var(--acx);word-break:break-all;font-size:13px}
.edit{font-size:12px;margin-top:8px;color:var(--mute)}.top .edit,.card.empty .edit{margin:0}#mnb{font-size:16px;line-height:1.2}
dialog{--pxc:4px;border:var(--bw) solid transparent;border-radius:0;background:var(--frm);color:var(--ink);width:min(560px,92vw);padding:21px;clip-path:var(--stair)}
dialog::backdrop{background:#0008}
dialog:focus,dialog:focus-visible{outline:none}
dialog h2{font:600 18px "BaDing",serif;letter-spacing:.1em;margin:0 0 12px}
dialog input[type=text]{--pxc:3px;--fill:var(--bg);clip-path:var(--cut);width:100%;border:var(--bw) solid transparent;background:var(--pxbg);border-radius:0;padding:6px 9px;margin-bottom:10px}
textarea{--pxc:3px;--fill:var(--bg);--bd:var(--line);clip-path:var(--cut);width:100%;border:var(--bw) solid transparent;background:var(--pxbg);border-radius:0;padding:7px 10px;margin-bottom:10px}
label{display:block;font-size:14px;color:var(--mute)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.acts.end{justify-content:flex-end;margin-top:16px}
.more{display:block;margin:0 auto}
#toast{position:fixed;inset:auto;margin:0;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border:0;border-radius:0;--pxc:3px;clip-path:var(--cut);max-width:90vw;z-index:9}
.note{--pxc:3px;clip-path:var(--cut);background:var(--soft);border-radius:0;padding:8px 12px;font-size:14px;margin-bottom:12px}
.tm{font:400 12px "Cubic 11",serif;color:var(--acx);margin-bottom:2px}
.hs{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 8px;margin:0 -2px}.hs+.hs{margin-top:6px;padding-top:14px;border-top:1px solid var(--line);opacity:1}
.hs>.card{flex:0 0 auto;width:fit-content;min-width:min-content;max-width:min(260px,78%);margin-top:0}.hs>.card.wide{max-width:min(320px,88%)}.hs>.card.hasm{min-width:min(260px,78%)}
.hi{flex:0 0 auto;width:fit-content;min-width:min-content;max-width:min(260px,78%);position:relative;padding-top:34px}.hi.wide{max-width:min(320px,88%)}.hi:has(.card.hasm){min-width:min(260px,78%)}.hi>.card{margin-top:0}
.hi::before{content:"";position:absolute;top:24px;left:-6px;right:-6px;height:2px;background:var(--acx)}
.hi:first-child::before{left:0}.hi:last-child::before{right:0}
.hi::after{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;clip-path:var(--dot12);background:var(--acx)}
.htm{position:absolute;left:0;top:0;font:400 12px/18px "Cubic 11",serif;color:var(--acx)}
.lab{margin-left:3px;flex:none;align-self:center;font-size:11px;font-weight:500;line-height:20px;padding:0 7px;--pxc:3px;border-radius:0;clip-path:var(--stair);background:var(--soft);color:var(--acx);white-space:nowrap}
.xb[hidden],.cx[hidden]{display:none}
.cbody.hm{max-height:130px}.cbody.hm.clip::after{display:none}.card:not(.open) .cbody.hm .txt:not(.hlc){display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;line-clamp:1;overflow:hidden}
.card.open .cbody{max-height:none}.card.open .cbody.clip::after{display:none}
.lh{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 6px}.lh .edit{margin:0}
.r{display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
input[type=radio],input[type=checkbox]{accent-color:var(--acc)}
#tv,#mvtv{--pxc:3px;--fill:var(--bg);clip-path:var(--cut);border:var(--bw) solid transparent;background:var(--pxbg);border-radius:0;padding:4px 8px}#tv:disabled,#mvtv:disabled{opacity:.4}
#dl{margin-right:auto;color:var(--del)}

const LBK='nyear-lb2';

let bkFile=null,bkSel='all';

async function prepBackup(){
 const st=$('#bst');bkFile=null;$('#bsave').style.display='none';bkSel=$('#bsel').value;
 try{
  st.textContent='準備中…';
  const all=await dbAll('people'),ps=bkSel==='all'?all:all.filter(p=>p.id===bkSel),
   parts=['{"app":"nyear-diary","v":1,"at":'+JSON.stringify(new Date().toISOString())+',"people":'+JSON.stringify(ps)+',"entries":['];
  let n=0;
  for(const p of ps)for(const e of await dbByP(p.id)){
   const media=[];for(const m of e.media||[])media.push({t:m.t,n:m.n,y:m.b.type,d:await b64(m.b),p:m.p?await b64(m.p):null});
   parts.push((n?',':'')+JSON.stringify({...e,media}));n++;st.textContent='準備中… '+n;
  }
  parts.push(']}');
  const nm=bkSel==='all'?'':'-'+(ps[0]?.name||'').replace(/[\\/:*?"<>|\s]+/g,'_');
  bkFile=new File(parts,'n-year-diary'+nm+'-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
  st.textContent=`完成：${ps.length} 位對象、${n} 則紀錄，約 ${(bkFile.size/1048576).toFixed(1)} MB。請按「儲存備份檔」。`;
  $('#bsave').style.display='';
 }catch(e){st.textContent='備份失敗：'+(e.message||e)}
}
function dl(f){const u=URL.createObjectURL(f),a=h('a',{href:u,download:f.name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function saveBackup(){
 if(!bkFile)return;
 try{
  if(navigator.canShare&&navigator.canShare({files:[bkFile]})){
   try{await navigator.share({files:[bkFile],title:'HTBU_?備份'})}catch(e){if(e.name==='AbortError')return;dl(bkFile)}
  }else dl(bkFile);
  markB(bkSel);updBlast();render();
  $('#bst').textContent='已送出。請確認檔案真的存到「檔案」App、雲端硬碟或其他安全的地方。';
 }catch(e){toast('無法儲存：'+(e.message||e))}
}
async function importBackup(f){
 const st=$('#bst2');
 try{
  st.textContent='讀取中…';
  const j=JSON.parse(await f.text());
  if(j.app!=='nyear-diary'||!Array.isArray(j.people)||!Array.isArray(j.entries))throw new Error('這不是 HTBU_? 的備份檔');
  for(const p of j.people)if(p&&p.id&&p.name)await dbPut('people',{id:String(p.id),name:String(p.name).slice(0,30),color:(/^#[0-9a-f]{6}$/i.test(p.color||'')||isTh(p.color))?p.color:(people.find(q=>q.id===String(p.id))?.color||null),tags:[...new Set([...(people.find(q=>q.id===String(p.id))?.tags||[]),...(Array.isArray(p.tags)?p.tags:[]).map(normTag).filter(Boolean)])].slice(0,200)});
  let n=0;
  for(const e of j.entries){
   if(!e||!e.k||!e.pid||!/^\d{4}-\d{2}-\d{2}$/.test(e.date))continue;
   const media=[];
   for(const m of e.media||[]){if(!['image','video','audio','file'].includes(m.t)||!/^data:/.test(m.d||''))continue;
    const b=await(await fetch(m.d)).blob(),ty=m.t==='file'?(/pdf/i.test(m.y||'')?'application/pdf':'application/octet-stream'):(m.y||b.type),
     it={t:m.t,n:String(m.n||''),b:new Blob([b],{type:ty})};
    if(m.t==='video'&&/^data:image\//.test(m.p||''))it.p=await(await fetch(m.p)).blob();media.push(it)}
   await dbPut('entries',{k:String(e.k),pid:String(e.pid),date:e.date,time:/^\d{2}:\d{2}$/.test(e.time)?e.time:null,text:String(e.text||''),
    links:(e.links||[]).map(String).filter(l=>/^https?:\/\//i.test(l)),tags:(e.tags||[]).map(x=>String(x).slice(0,20)).slice(0,10),media,quote:(e.quote&&typeof e.quote==='object'&&e.quote.k)?e.quote:null,reviewed:Number(e.reviewed)||0});
   n++;st.textContent=`匯入中… ${n}/${j.entries.length}`;
  }
  people=await dbAll('people');people.sort((a,b)=>a.id<b.id?-1:1);
  await sel(people.find(p=>p.id===cur)?cur:people[0]?.id||null);
  st.textContent=`匯入完成：${n} 則紀錄。`;
 }catch(e){st.textContent='匯入失敗：'+(e.message||e)}
}
