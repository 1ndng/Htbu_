body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 "Cubic 11","BaDing",sans-serif;letter-spacing:.04em}
main{max-width:720px;margin:0 auto;padding:18px 16px 100px}
h1{font:400 32px "BaDing","Cubic 11",serif;letter-spacing:.1em;margin:0;text-align:center}
*{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
.card .txt,.card .txt *,#dtc .dtt,#dtc .dtt *{-webkit-user-select:text;user-select:text}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:var(--bw) solid transparent;background:var(--pxbg);border-radius:0;clip-path:var(--cut);padding:5px 12px;font-size:13px}
input:not([type=radio]):not([type=checkbox]):focus,select:focus,textarea:focus,.fl:focus-visible{--bd:var(--acx);outline:2px solid var(--acx);outline-offset:1px}
button:focus-visible:not(:disabled){outline:2px solid var(--acx);outline-offset:1px}
button:active:not(:disabled){--hi:var(--blo);--lo:var(--bhi)}
button.pri:focus,button.pri:active,button.tg.on:focus,button.tg.on:active,button#fab:focus,button#fab:active{--bd:var(--ink);outline-color:var(--acc)}
.dhead .arrow:focus,.dhead .arrow:active,.hmhead button:focus,.hmhead button:active{clip-path:none;outline:1px solid var(--acx);outline-offset:2px}
a:focus-visible{outline:2px solid var(--acx);outline-offset:2px}
.pri{--fill:var(--acc);--bd:var(--ink);color:var(--onacc);border-radius:0;clip-path:var(--cut)}
.prow{display:flex;align-items:center;gap:8px}


/* +／-按鈕固定在右側，不跟著對象、標籤滑動 */


.dhead{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:nowrap;margin:14px 0 12px}
.dgL,.dgR{display:flex;align-items:center;gap:6px;flex:none}.dgR{margin-left:auto}
@media (max-width:400px){.dhead .dgR .edit{padding:0 6px}.dhead .arrow{padding:0 5px}.dgL,.dgR{gap:3px}}
.dhead .edit{margin:0;height:32px;line-height:28px;padding:0 12px;box-sizing:border-box}
.dpick{position:relative}.dpick .dpin{position:absolute;inset:0;opacity:0;border:0;padding:0;margin:0;width:100%;height:100%;cursor:pointer}
.dhead .arrow{padding:0 9px;position:relative;color:transparent;border:none;background:none;clip-path:none}
.dhead .arrow::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:16px;transform:translate(-50%,-50%);background:var(--mute);-webkit-mask:var(--ar-l) center/contain no-repeat;mask:var(--ar-l) center/contain no-repeat}
.dhead .arrow[aria-label="後一天"]::after{-webkit-mask-image:var(--ar-r);mask-image:var(--ar-r)}
.who{font-size:13px;font-weight:500;color:var(--acx);margin-bottom:2px}
.day{font:400 33px/1.2 "Cubic 11","BaDing",serif;margin:0;flex:none;white-space:nowrap}.day .dn{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.sub{color:var(--mute);margin:0 0 22px}
.tl{border-left:1.5px solid var(--acc);margin-left:6px}
.row{position:relative;padding:0 0 26px 24px}
.row::before{content:"";position:absolute;left:-.75px;top:11px;width:12px;height:12px;background:var(--acc);clip-path:var(--dot12);transform:translateX(-50%) scale(1.15)}
.row::after{content:"";position:absolute;left:-.75px;top:13px;width:8px;height:8px;background:var(--bg);clip-path:var(--dot8);transform:translateX(-50%) scale(1.15)}
.row.has::after{background:var(--acc)}.row.has::before{background:var(--acc)}
.rh{display:flex;align-items:center;height:34px}.rh .radd{margin:0 0 0 auto;flex:none}.yr{font:400 22px/1 "Cubic 11",serif;letter-spacing:.1em;margin-right:8px}.ago{color:var(--mute);font-size:11px;line-height:1}
.card{background:var(--frm);border:var(--bw) solid transparent;border-radius:0;margin-top:8px;clip-path:var(--stair);display:flex;flex-direction:column}
.cbody{overflow:hidden;position:relative;flex:1 1 auto}
.cbody.clip::after{pointer-events:none;content:'';position:absolute;left:0;right:0;bottom:0;height:1.6em;background:linear-gradient(to bottom,transparent,var(--card))}

.txt{white-space:pre-wrap;word-break:break-word;margin:0 0 6px}.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
mark{padding:0 2px}
.media{display:grid;grid-template-columns:repeat(auto-fill,72px);gap:8px;margin:8px 0}
.th{clip-path:var(--cut);position:relative;width:72px;height:72px;border-radius:0;overflow:hidden;cursor:zoom-in;background:#0004;border:var(--bw) solid var(--ink)}.th img,.th video{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;background:#0003;pointer-events:none}
.media audio{grid-column:1/-1;width:100%;height:34px}
.links a{display:block;color:var(--hotx,var(--acx));word-break:break-all;font-size:13px}
.edit{font-size:12px;margin-top:8px;color:var(--mute)}
dialog{border:var(--bw) solid transparent;border-radius:0;background:var(--frm);color:var(--ink);width:min(560px,92vw);padding:21px;clip-path:none}
dialog::backdrop{background:#0008}
dialog:focus,dialog:focus-visible{outline:none}
dialog h2{font:600 18px "BaDing",serif;letter-spacing:.1em;margin:0 0 12px}
dialog input[type=text]{--fill:var(--card);clip-path:var(--cut);width:100%;border:var(--bw) solid transparent;background:var(--pxbg);border-radius:0;padding:6px 9px;margin-bottom:10px}
textarea{--fill:var(--card);--bd:var(--ink);clip-path:var(--cut);width:100%;border:var(--bw) solid transparent;background:var(--pxbg);border-radius:0;padding:7px 10px;margin-bottom:10px}
label{display:block;font-size:14px;color:var(--mute)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.acts.end{justify-content:flex-end;margin-top:16px}
.more{display:block;margin:0 auto}
#toast{position:fixed;inset:auto;margin:0;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border:0;border-radius:0;clip-path:var(--cut);max-width:90vw;z-index:9}
.note{clip-path:var(--cut);background:var(--hotbg,var(--soft));border-radius:0;padding:8px 12px;font-size:14px;margin-bottom:12px}

.hs{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px 2px 8px;margin:0 -2px}.hs+.hs{margin-top:6px;padding-top:14px;border-top:1px solid var(--line);opacity:1}
.hs>.card{flex:0 0 auto;width:fit-content;min-width:min-content;max-width:min(260px,78%);margin-top:0}.hs>.card.wide{max-width:min(320px,88%)}.hs>.card.hasm,.hs>.card:has(.qv){min-width:min(260px,78%)}
.hi{flex:0 0 auto;width:fit-content;min-width:min-content;max-width:min(260px,78%);position:relative;padding-top:34px}.hi.wide{max-width:min(320px,88%)}.hi:has(.card.hasm),.hi:has(.card .qv){min-width:min(260px,78%)}.hi>.card{margin-top:0}
.hi::before{content:"";position:absolute;top:24px;left:-6px;right:-6px;height:1px;background:var(--acc)}
.hi:first-child::before{left:0}.hi:last-child::before{right:0}
.htm::after{content:"";position:absolute;left:50%;transform:translateX(-50%);top:18.5px;width:12px;height:12px;clip-path:var(--dot12);background:var(--acc)}
.htm{position:absolute;left:0;top:0;font:400 12px/18px "Cubic 11",serif;color:var(--acc)}

.xb[hidden],.cx[hidden]{display:none}
.cbody.hm{max-height:130px}.cbody.hm.clip::after{display:none}.card:not(.open) .cbody.hm .txt:not(.hlc){display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;line-clamp:1;overflow:hidden}
.card.open .cbody{max-height:none}.card.open .cbody.clip::after{display:none}
.lh{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 6px}.lh .edit{margin:0}
.r{display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
input[type=radio],input[type=checkbox]{accent-color:var(--acc)}
#tv,#mvtv{--fill:var(--card);clip-path:var(--cut);border:var(--bw) solid transparent;background:var(--pxbg);border-radius:0}#tv:disabled,#mvtv:disabled{opacity:.4}
#dl{margin-right:auto}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;--fill:var(--acc);--bd:var(--ink);color:var(--onacc);padding:11px 18px;margin:0;font-size:14px;font-weight:500}
#fab[hidden]{display:none}
#lb{width:fit-content;min-width:min(240px,90vw);max-width:96vw;padding:calc(var(--tt,36px) + 6px) 8px 8px;overflow:hidden}
#lbc{width:fit-content;margin:0 auto;background:#000;border:2px solid;border-color:var(--blo) var(--bhi) var(--bhi) var(--blo);display:flex;justify-content:center;align-items:center}
#lb img,#lb video{clip-path:none;display:block;max-width:calc(96vw - 32px);max-height:calc(100vh - 120px);max-height:calc(100dvh - 120px);border-radius:0;margin:auto}
.tb{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;align-items:center;margin:4px 0 8px}.tb::-webkit-scrollbar{display:none}.tb button{padding:2px 9px;flex:none;white-space:nowrap}
.sw{flex:none;width:30px;height:30px;border-radius:0;padding:0;border:var(--bw) solid var(--ink)}
/* 所有選顏色的方框：比照主題色設定（30×30、內凹框），方框裡一律顯示彩虹 */
input[type=color]{clip-path:var(--cut);-webkit-appearance:none;appearance:none;width:30px;height:30px;min-height:0;padding:0;margin:0;border:var(--bw) solid var(--ink);border-radius:0;overflow:hidden;background:conic-gradient(from 0deg,#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000);flex:none;cursor:pointer;vertical-align:middle;box-sizing:border-box}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:0;opacity:0}input[type=color]::-moz-color-swatch{border:0;border-radius:0;opacity:0}

@supports (-webkit-touch-callout:none){textarea,input,select{font-size:16px}}

input.tmx:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink)}
#tmwrap:has(input[value=now]:checked) #tv,#mvtw:has(input[value=now]:checked) #mvtv{opacity:.4}
#tmwrap .acts,#mvtw .acts{gap:10px;align-items:center}
@media (max-width:400px){#tmwrap .acts,#mvtw .acts{column-gap:10px}}
.acts label.r{letter-spacing:1.56px;font-size:13px}
/* ===== 週總結 dump 編輯器 ===== */
#dmml{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto;margin-bottom:8px}
#dmbg .mb{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}#dmbg .mb .edit{min-width:200px;justify-content:center}#dmbgcw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;letter-spacing:1.56px;color:var(--ink)}#dmbg .mb .edit.on,#dmbgcw.on{outline:2px solid var(--ink);outline-offset:2px}
#dmvn{margin:-6px -12px 0;padding:8px 12px;text-align:center;font:400 17px/1.4 "Cubic 11","BaDing",serif;letter-spacing:.08em;border-bottom:1px solid var(--sep);box-shadow:0 1px 0 var(--bhi);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dmvp{display:flex;align-items:center;gap:16px;padding:12px 4px;margin:0 0 10px;border-bottom:1px solid var(--sep);box-shadow:0 1px 0 var(--bhi)}
#dmvs{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1.4}#dmvs b{font-weight:400;font-size:20px}#dmvs span{font-size:13px;color:var(--mute)}
/* 瀏覽的內框：dump 貼齊內框（內凹邊框疊在 dump 上），右側固定留捲軸寬，三篇＋捲軸＝內框寬 */
#dmvf{position:relative;margin-bottom:8px;background:var(--card);box-shadow:0 0 0 1px var(--ink)}
#dmvf::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;box-shadow:inset 1px 1px 0 var(--blo),inset -1px -1px 0 var(--bhi)}
#dmvl{max-height:52vh;max-height:52dvh;overflow-y:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;align-content:start;padding:0 15px 0 0;box-sizing:border-box}
html.jsb #dmvl,html.jsb #dmvl.sbon{padding:0 15px 0 0}
#dmvl>p.sub{grid-column:1/-1;margin:16px 0!important;text-align:center}

.dmvt2{position:relative;padding:0;background:#000;aspect-ratio:9/16;overflow:hidden;clip-path:none;min-width:0}
.dmvt2 img,.dmvt2 video{width:100%;height:100%;display:block;pointer-events:none}
.dmvt2 .dmvp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;line-height:30px;border-radius:50%;background:#0009;color:#fff;font-size:13px;text-align:center}
.dmvt2 .dmvd{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;font-size:10px;line-height:16px;text-align:center}
.dmvt2{border:0;box-shadow:none}.dmvt2 img,.dmvt2 video{object-fit:contain}

/* 點開的 dump：框縮到跟圖一樣大（不留黑邊），內凹邊框疊在圖上 */
#dmvwc{position:relative;display:block;width:fit-content;max-width:100%;margin:0 auto 8px;padding:0;line-height:0;background:#000;box-shadow:0 0 0 1px var(--ink)}
#dmvwc::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 2px 2px 0 var(--blo),inset -2px -2px 0 var(--bhi)}
#dmvwc img,#dmvwc video{display:block;max-width:100%;max-height:62vh;max-height:62dvh;width:auto;height:auto;clip-path:none;border:0;margin:0}
#dmvws{text-align:center;margin:0 0 8px!important}
#dmp{width:100vw;max-width:100vw;height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;margin:0;padding-left:8px;padding-right:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#dmp[open]{display:flex;flex-direction:column;gap:8px;overflow:hidden}
#dmw{flex:1 1 0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
#dmcv{display:block;touch-action:none;box-shadow:0 0 0 1px var(--ink)}
#dmsb{flex:none;display:flex;gap:6px;justify-content:safe center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;align-items:center}#dmsb::-webkit-scrollbar{display:none}
#dmsb>button{flex:none;padding-left:7px;padding-right:7px;margin:0}
#dmsb .edit{margin:0}#dmsb .sub{margin:0;text-align:center}
/* 編輯頁選單：比照首頁的選單列與下拉選單 */
#dmp{padding-top:env(safe-area-inset-top,0px)}
#dmpt{margin-left:auto;align-self:center;padding:0 4px 0 12px;font-size:12px;color:var(--mute);white-space:nowrap}
#dmmb{flex:none;margin:0 -8px;border-top:1px solid var(--bhi);border-bottom:1px solid var(--blo);display:flex;align-items:stretch;padding:0 7px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;background:var(--bg)}#dmmb::-webkit-scrollbar{display:none}
#dmdd{position:absolute;z-index:3;width:max-content;min-width:150px;max-width:calc(100vw - 8px);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border:1px solid var(--ink);box-shadow:inset 1px 1px 0 var(--bhi),inset -1px -1px 0 var(--blo),1px 1px 0 var(--ink);padding:3px 0}
#dmdd[hidden],#dmbk[hidden]{display:none}#dmbk{position:absolute;inset:0;z-index:2;touch-action:none}
#dmmb .mi:active,#dmdd .mit:active,#dmdd .mit:active *{text-indent:0}
#dmsb{min-height:28px}
#dmsb .dmdel{color:var(--del)}#dmsb .dmundo{margin-right:6px}#dmsb .dmundo[disabled]{opacity:.45}
#dmsb .dmtg.on{--fill:var(--acc);--bd:var(--ink);color:var(--onacc)}
#dmp>.acts.xe{margin:0!important;height:0}
#dmcf{position:relative;width:min(100%,calc(55vh * 9 / 16));aspect-ratio:9/16;margin-left:auto!important;margin-right:auto!important;overflow:hidden;background:#000;touch-action:none;margin:0 0 8px;box-shadow:0 0 0 1px var(--ink)}
#dmci{position:absolute;left:0;top:0;max-width:none;max-height:none;border:0;clip-path:none;pointer-events:none;-webkit-user-select:none;user-select:none}
#dmcz{width:100%;margin:4px 0 8px}
#dmil{max-height:58vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;margin-bottom:8px}
#dmil .rd{font-size:13px;margin-bottom:2px}
/* 搜尋欄比照主頁 */
#dmisr{display:flex;gap:6px;align-items:stretch;margin:0 0 10px}
#dmis{--bw:1px;clip-path:var(--cut);display:block;flex:1;min-width:0;width:auto;border:var(--bw) solid transparent;background:var(--pxbg);border-radius:0;padding:4px 7px;margin:0;line-height:1.3;-webkit-appearance:none;appearance:none}
#dmisb{flex:none;min-width:56px;padding:0 12px;font-size:13px;letter-spacing:1.56px;line-height:19.6px;margin:0}
/* 分隔線：虛線＝同一組裡的每則紀錄；實線＝同一天「有時間／沒時間」的交界、以及不同日期之間 */
.dmie{padding:6px 0 8px}.dmie+.dmie{border-top:1px dashed var(--sep)}.dmie.dmsplit{border-top:1px solid var(--sep)}
#dmil .rd.dmday:not(:first-child){border-top:1px solid var(--sep);padding-top:10px}
#dmil .dmck{cursor:pointer;-webkit-user-select:none;user-select:none;padding:2px 0}
#dmil .dmck .cbx{margin:0;flex:none}#dmil .dmck.dmc{align-items:flex-start}#dmil .dmck.dmc .cbx{margin-top:4px}#dmil .dmck.dmc .dmtx{flex:1;margin:0}
.dmtm{color:var(--hotx,var(--acx));margin-right:.6em}
#dmil .dmlab{font-size:13px;margin:2px 0 0 19px}
.dmtx{font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;margin:2px 0 0 19px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.dmtx.open{display:block}
#dmil .dmmore{margin:4px 0 0 19px;padding:0 8px;font-size:11px;line-height:20px;height:auto}
/* 照片／影片：勾選框疊在縮圖左上，縮圖列整體內縮，第一張與文字左對齊 */
#dmil .dmim{margin-left:19px}
#dmil .dmim .dmck.dmth{position:relative;display:block;padding:0}
#dmil .dmim .dmck.dmth .cbx{position:absolute;left:4px;top:4px;z-index:1;margin:0}
.dmthi{position:relative;display:block;width:64px;height:64px;flex:none;border:1px solid var(--ink);background:#0004;overflow:hidden}
.dmthi img{width:100%;height:100%;object-fit:cover;display:block;clip-path:none;border:0}
#dmil .dmck{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}
#dmil .dmct{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.dmim{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
#dmxt{width:100%;box-sizing:border-box;margin-bottom:8px}
/* 選顏色時旁邊的五個主題色快選（主題色①②、功能深色、功能淺色、對比色） */
.dmsw{display:inline-flex;gap:4px;margin-left:4px;vertical-align:middle;flex-wrap:nowrap}.sw.dmsws{width:22px;height:22px;padding:0;min-width:0;margin:0;flex:none}
#dmthl .sw.on{outline:2px solid var(--ink);outline-offset:2px}
#dmr{width:min(300px,86vw);text-align:center}#dmr p{margin:0 0 12px;font-size:15px;line-height:1.6;white-space:pre-line}#dmr .acts{margin:0}
.dmvwb{justify-content:center;flex-wrap:wrap}.dmvwb button[hidden]{display:none}
#dmwe input[type=text]{width:100%;box-sizing:border-box;margin:4px 0 10px}
#dmcol .dmpx{justify-content:flex-start}#dmcol .dmpx{flex-wrap:nowrap;gap:4px}#dmcol .dmpx label{min-width:5.2em;letter-spacing:0}#dmcol .dmpx button:not(.dmsws){padding:0 6px}#dmcol .dmpx button{margin-left:auto}#dmcos{margin:0 0 8px!important}
.dmpx{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px;font-size:13px}.dmpx label{display:inline;margin:0;font-size:13px}.dmpx input[type=number]{width:76px;margin:0}.dmpx select{margin:0}.dmpx button{margin:0 0 0 auto}
#dmx .acts{margin:0 0 8px}#dmxsw[hidden]{display:none}
/* 拉桿：Win95 軌道（凹槽）＋長方形滑塊，顏色跟著主題色 */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:22px;padding:0;border:0;box-shadow:none;clip-path:none;cursor:pointer;touch-action:pan-y}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--btnf);border:0;box-shadow:inset 1px 1px 0 var(--blo),inset 2px 2px 0 var(--ink),inset -1px -1px 0 var(--bhi)}
input[type=range]::-moz-range-track{height:4px;background:var(--btnf);border:0;box-shadow:inset 1px 1px 0 var(--blo),inset 2px 2px 0 var(--ink),inset -1px -1px 0 var(--bhi)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:11px;height:21px;margin-top:-8.5px;border:0;border-radius:0;background:var(--btnf);box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--bhi),inset -2px -2px 0 var(--blo)}
input[type=range]::-moz-range-thumb{width:11px;height:21px;border:0;border-radius:0;background:var(--btnf);box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--bhi),inset -2px -2px 0 var(--blo)}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:1px dotted var(--ink);outline-offset:-4px}
input[type=range]:disabled{cursor:default}
</style>
</head>

<script>
(()=>{const o=HTMLDialogElement.prototype.showModal;HTMLDialogElement.prototype.showModal=function(){o.call(this);const a=document.activeElement;if(a&&a!==document.body&&this.contains(a)&&a.matches('input,textarea,select,button'))a.blur()}})();

{const sm=HTMLDialogElement.prototype.showModal;HTMLDialogElement.prototype.showModal=function(){if(window.decoDlg)decoDlg(this);if(window.wrLock)wrLock(true);sm.call(this);if(window.sbRefresh)sbRefresh();const a=document.activeElement;if(a&&this.contains(a)&&(a.tagName==='BUTTON'||(a.tagName==='INPUT'&&a.type==='radio'))){a.blur();this.tabIndex=-1;this.focus({preventScroll:true})}}}

let hmY=null,hmData=[],hmPid=null;
let MINY=+localStorage.getItem('nyear-miny')||null;
const FK='nyear-feat',FEAT={people:true,tags:true,time:true,quote:true,md:true,sound:true};
try{Object.assign(FEAT,JSON.parse(localStorage.getItem(FK)||'{}'))}catch(e){}

let db,useMem=false,M={people:{},entries:{},dumps:{}},people=[],cur=null,E={},urls=[],extra=0,hy=null,multi=false,msel=new Set(),edDate=null,edK=null,draft=[],durls=[],dturls=[],dtags=[],dquote=null,qs='',ftags=[],rlim=50,qt,other=false;
const NODATE='0000-00-00',tsOf=e=>+String(e.k).split('|').pop()||0;

function ask(sub,title){return new Promise(res=>{const d=$('#cf'),s=$('#cfs');$('#cft').textContent=title||'是否刪除？';s.textContent=sub||'';s.hidden=!sub;let done=false;
 const fin=v=>{if(done)return;done=true;if(d.open)d.close();res(v)};
 $('#cfy').onclick=()=>fin(true);$('#cfn').onclick=()=>fin(false);d.onclose=()=>fin(false);d.showModal()})}
async function clr(id){const e=$(id);if(e.value&&await ask())e.value=''}
function toast(t){const e=$('#toast');e.textContent=t;if(!e.matches(':popover-open'))e.showPopover();clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidePopover(),3500)}
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('nyear-diary',2);
q.onupgradeneeded=()=>{const d=q.result,has=n=>d.objectStoreNames.contains(n);if(!has('people'))d.createObjectStore('people',{keyPath:'id'});if(!has('entries'))d.createObjectStore('entries',{keyPath:'k'}).createIndex('pid','pid');if(!has('dumps'))d.createObjectStore('dumps',{keyPath:'k'})};
q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>{useMem=true;r()}}catch(e){useMem=true;r()}})}
const req=(st,mode,f)=>new Promise((res,rej)=>{const t=db.transaction(st,mode);const r=f(t.objectStore(st));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
const dbAll=st=>useMem?Promise.resolve(Object.values(M[st])):req(st,'readonly',s=>s.getAll());
const dbPut=(st,v)=>useMem?(M[st][v.id||v.k]=v,Promise.resolve()):req(st,'readwrite',s=>s.put(v));
const dbDel=(st,k)=>useMem?(delete M[st][k],Promise.resolve()):req(st,'readwrite',s=>s.delete(k));
const dbByPAll=id=>useMem?Promise.resolve(Object.values(M.entries).filter(e=>e.pid===id)):req('entries','readonly',s=>s.index('pid').getAll(id));
const dbByP=id=>dbByPAll(id).then(a=>a.filter(e=>!e.archived));

async function loadView(){E={};const ids=multi?[...msel]:cur?[cur]:[];for(const id of ids)(await dbByP(id)).forEach(e=>{if((e.date===NODATE)!==other)return;(E[e.date]||(E[e.date]=[])).push(e)})}
async function sel(id){cur=id;multi=false;document.documentElement.classList.remove('rvm');drawMbar();hy=null;extra=0;ftags=[];rlim=50;applyTheme(people.find(p=>p.id===id)?.color);await loadView();render()}
async function toggleMulti(){multi=!multi;if(multi){other=false;msel=new Set(people.map(p=>p.id))}hy=null;ftags=[];document.documentElement.classList.toggle('rvm',multi);if(multi)closeMenu();drawMbar();applyTheme(multi?REVCOL:people.find(p=>p.id===cur)?.color);await loadView();render()}
async function toggleOther(){
 if(!other&&!cur){toast('請先新增對象');return}
 other=!other;if(other)multi=false;hy=null;ftags=[];qs='';$('#q').value='';rlim=50;
 applyTheme(people.find(p=>p.id===cur)?.color);await loadView();render()}
async function tog(id){msel.has(id)?msel.delete(id):msel.add(id);ftags=ftags.filter(x=>msel.has(x.pid));await loadView();render()}
async function addP(){const n=$('#pn').value.trim();if(!n)return;const p={id:'p'+Date.now(),name:n};await dbPut('people',p);people.push(p);$('#pn').value='';pd.close();sel(p.id)}
/* 編輯／刪除對象：只針對目前的對象 */
let peMode='edit',peId=null;
function openPe(mode){if(!people.some(p=>p.id===cur)){toast('目前沒有對象');return}peMode=mode==='del'?'del':'edit';peId=cur;
 $('#pet').textContent=peMode==='del'?'刪除對象':'編輯對象';$('#peo').textContent=peMode==='del'?'刪除':'儲存';
 $('#penw').hidden=$('#peaw').hidden=peMode==='del';$('#pen').value=pname(peId);peAvLoad(peId);
 pe.showModal();if(peMode==='edit'){$('#pen').focus();$('#pen').select()}}
/* 頭貼編輯：選圖後在圓框裡拖曳、縮放；儲存時裁成 256×256 */
let peAv=null;
const avAcc=P=>colInfo(P&&P.color)?.acc||PRE[0];
function avEl(P,size,cls){const d=h('div',{class:'av'+(cls?' '+cls:''),style:`width:${size}px;height:${size}px;background:${P&&P.avc||avAcc(P)}`});if(P&&P.av)d.append(h('img',{src:P.av,alt:''}));return d}
function peAvLoad(id){const P=people.find(p=>p.id===id);peAv={P,mode:P&&P.av?'img':P&&P.avc?'color':null,color:P&&P.avc||avAcc(P),img:null,z:1,cx:0,cy:0,dirty:false};
 if(peAv.mode==='img'){const i=new Image();i.onload=()=>{peAv.img=i;peAv.cx=i.naturalWidth/2;peAv.cy=i.naturalHeight/2;peAvDraw()};i.src=P.av}
 $('#peac').value=String(peAv.color).toLowerCase().startsWith('#')?String(peAv.color).toLowerCase():'#000080';$('#peaz').value=1;peAvDraw()}
function peAvGeo(){const F=$('#peaf').clientWidth||96,im=peAv.img,iw=im.naturalWidth,ih=im.naturalHeight,s=Math.max(F/iw,F/ih)*peAv.z,v=F/s;
 peAv.cx=Math.min(iw-v/2,Math.max(v/2,peAv.cx));peAv.cy=Math.min(ih-v/2,Math.max(v/2,peAv.cy));return{F,iw,ih,s,v}}
function peAvDraw(){const f=$('#peaf'),i=$('#peai'),img=peAv&&peAv.mode==='img'&&peAv.img;f.style.background=peAv&&peAv.mode==='color'?peAv.color:avAcc(peAv&&peAv.P);
 $('#peaz').disabled=!img;i.hidden=!img;if(!img)return;const g=peAvGeo();i.src=img.src;
 Object.assign(i.style,{width:g.iw*g.s+'px',height:g.ih*g.s+'px',left:(g.F/2-peAv.cx*g.s)+'px',top:(g.F/2-peAv.cy*g.s)+'px'})}
function peAvSet(mode){if(!peAv)return;peAv.mode=mode;peAv.dirty=true;if(mode===null)$('#peac').value=String(avAcc(peAv.P)).toLowerCase().startsWith('#')?avAcc(peAv.P).toLowerCase():'#000080';peAvDraw()}
$('#peac').addEventListener('input',()=>{if(!peAv)return;peAv.color=$('#peac').value;peAvSet('color')});
$('#peaz').oninput=()=>{if(peAv){peAv.z=+$('#peaz').value;peAv.dirty=true;peAvDraw()}};
$('#peaf2').onchange=()=>{const f=$('#peaf2').files&&$('#peaf2').files[0];$('#peaf2').value='';if(!f||!peAv)return;const u=URL.createObjectURL(f),i=new Image();
 i.onload=()=>{peAv.img=i;peAv.z=1;$('#peaz').value=1;peAv.cx=i.naturalWidth/2;peAv.cy=i.naturalHeight/2;peAvSet('img')};i.onerror=()=>toast('無法讀取這張圖片');i.src=u};
{let st=null;const F=$('#peaf');F.addEventListener('pointerdown',e=>{if(!peAv||peAv.mode!=='img'||!peAv.img)return;st={x:e.clientX,y:e.clientY,cx:peAv.cx,cy:peAv.cy};F.setPointerCapture(e.pointerId)});
 F.addEventListener('pointermove',e=>{if(!st)return;const g=peAvGeo();peAv.cx=st.cx-(e.clientX-st.x)/g.s;peAv.cy=st.cy-(e.clientY-st.y)/g.s;peAv.dirty=true;peAvDraw()});
 ['pointerup','pointercancel'].forEach(t=>F.addEventListener(t,()=>{st=null}))}
function peAvOut(){if(!peAv||peAv.mode!=='img'||!peAv.img)return null;const g=peAvGeo(),c=document.createElement('canvas');c.width=c.height=256;
 c.getContext('2d').drawImage(peAv.img,peAv.cx-g.v/2,peAv.cy-g.v/2,g.v,g.v,0,0,256,256);return c.toDataURL('image/jpeg',.86)}

async function renameP(id){const P=people.find(p=>p.id===id),n=$('#pen').value.trim();if(!P)return;if(!n){toast('請輸入對象名稱');return}

async function delP(id){const P=people.find(p=>p.id===id);if(!P)return;pe.close();if(!await ask(`「${P.name}」與全部紀錄都會被刪除`))return;

 people=people.filter(p=>p.id!==id);msel.delete(id);
 if(id===cur)await sel(people[0]?.id||null);else render()}

const mu=(m,l=urls)=>{const u=URL.createObjectURL(m.b);l.push(u);return u};
function shot(v){const W=480,vw=v.videoWidth||W,vh=v.videoHeight||W,r=Math.min(1,W/vw),c=document.createElement('canvas');c.width=Math.max(1,Math.round(vw*r));c.height=Math.max(1,Math.round(vh*r));
 try{c.getContext('2d').drawImage(v,0,0,c.width,c.height)}catch(e){return Promise.resolve(null)}
 return new Promise(res=>c.toBlob(res,'image/jpeg',.8))}
function mkPoster(b){return new Promise(res=>{const u=URL.createObjectURL(b),v=document.createElement('video');let done=false;
 const fin=r=>{if(done)return;done=true;URL.revokeObjectURL(u);res(r)};
 v.muted=true;v.playsInline=true;v.preload='auto';v.onerror=()=>fin(null);
 v.onloadedmetadata=()=>{v.currentTime=Math.min(.5,(v.duration||1)/2)};
 v.onseeked=()=>shot(v).then(fin);v.src=u;setTimeout(()=>fin(null),8000)})}
function toCover(f){return new Promise(res=>{const u=URL.createObjectURL(f),i=new Image();
 i.onload=()=>{const r=Math.min(1,480/i.naturalWidth),c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*r);c.height=Math.round(i.naturalHeight*r);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(res,'image/jpeg',.85)};
 i.onerror=()=>{URL.revokeObjectURL(u);res(null)};i.src=u})}
const fileA=(m,L)=>{const pdf=/pdf/i.test(m.b.type||'')||/\.pdf$/i.test(m.n||'');
 return h('a',{class:'fl',href:mu(m,L),...(pdf?{target:'_blank',rel:'noopener'}:{download:m.n||'file'})},'📄 '+(m.n||'檔案'))};
const fmtT=t=>{if(!isFinite(t)||t<0)return'--:--';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function mkCtl(a,box,info){/* 音訊／影片共用的播放控制：進度軌道＋倒退／播放暫停／快轉／停止 */
 const thm=h('div',{class:'thm'}),trk=h('div',{class:'trk'},thm);
 const fin=()=>isFinite(a.duration)&&a.duration>0,
  upd=()=>{const t=a.currentTime||0;if(info){info.pos.textContent=fmtT(t);info.len.textContent=fmtT(fin()?a.duration:NaN)}box.classList.toggle('nodur',!fin());
   box.style.setProperty('--f',fin()?Math.min(1,t/a.duration):0)},
  go=t=>{if(fin())a.currentTime=Math.max(0,Math.min(a.duration,t))},
  seekX=x=>{const r=trk.getBoundingClientRect(),f=Math.max(0,Math.min(1,(x-r.left-9)/Math.max(1,r.width-18)));go(f*(a.duration||0))};
 a.addEventListener('loadedmetadata',()=>{if(a.duration===Infinity){a.currentTime=1e101;a.addEventListener('timeupdate',function f(){a.removeEventListener('timeupdate',f);a.currentTime=0;upd()})}upd()});
 ['durationchange','timeupdate','seeked','ended'].forEach(ev=>a.addEventListener(ev,upd));
 a.addEventListener('play',()=>{box.classList.add('playing');document.querySelectorAll('audio,video').forEach(x=>{if(x!==a&&!x.paused)x.pause()})});

   const base=JSON.stringify({...e,media:PH}).split('"'+PH+'"'),ep=[(gn?',':'')+base[0]+'['];

(function(){try{

  if(!e.isTrusted||!e.detail||e.defaultPrevented)return;
  const t=e.target;if(!(t instanceof Element))return;
  if(t.closest('button,a,input,textarea,select,label,summary,[contenteditable],#mdd,#mbar,.xcl,.xbk'))return;
  const root=t.closest('dialog[open]')||document,x=e.clientX,y=e.clientY;let best=null,bd=1e9;

   const dx=Math.max(r.left-x,0,x-r.right),dy=Math.max(r.top-y,0,y-r.bottom);
