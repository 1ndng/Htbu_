<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>N年日記</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e7566">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="N年日記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@600&display=swap">
<style>
:root{--bg:#eceff2;--card:#fff;--ink:#1c2630;--mute:#66737f;--line:#d3dae0;--acc:#0e7566;--soft:#e2f0ed;--mark:rgba(14,117,102,.28);--onacc:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171c;--card:#1b232b;--ink:#e6ecf0;--mute:#94a1ac;--line:#2f3a44;--acc:#4fc1ae;--soft:#1a3531;--mark:rgba(79,193,174,.32);--onacc:#10201d}}
:root[data-theme="dark"]{--bg:#12171c;--card:#1b232b;--ink:#e6ecf0;--mute:#94a1ac;--line:#2f3a44;--acc:#4fc1ae;--soft:#1a3531;--mark:rgba(79,193,174,.32);--onacc:#10201d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Noto Sans TC",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:18px 16px 100px}
h1{font:600 20px "Noto Serif TC",serif;margin:0;text-align:center}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:14px}.top>:first-child{justify-self:start}.top>:last-child{justify-self:end}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 12px;font-size:13px}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
#ppl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.chip{border-radius:99px}.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}.chip.add{color:var(--mute);border-style:dashed}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap;margin:14px 0 2px}.dctl{display:flex;align-items:center;gap:6px;margin-left:auto}.dctl button{padding:5px 10px}
.who{font-size:13px;font-weight:500;color:var(--acc);margin-bottom:2px}.who::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:5px}
.dctl input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 8px;min-width:0}
.day{font:600 32px/1.2 "Noto Serif TC",serif;margin:0}
.sub{color:var(--mute);margin:0 0 22px}
.tl{border-left:2px solid var(--line);margin-left:6px}
.row{position:relative;padding:0 0 26px 24px}
.row::before{content:"";position:absolute;left:-7px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--mute)}
.row.has::before{background:var(--acc);border-color:var(--acc)}
.yr{font:600 20px "Noto Serif TC",serif;margin-right:8px}.ago{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:8px}
.card.empty{background:transparent;border-style:dashed;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:8px}
.txt{white-space:pre-wrap;word-break:break-word;margin:0 0 6px}.clamp{max-height:6.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.media{display:grid;grid-template-columns:repeat(auto-fill,72px);gap:8px;margin:8px 0}
.th{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;cursor:zoom-in;background:#0002}.th img,.th video{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;background:#0003;pointer-events:none}
.media audio{grid-column:1/-1;width:100%;height:34px}
.links a{display:block;color:var(--acc);word-break:break-all;font-size:13px}
.edit{font-size:13px;margin-top:8px;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(560px,92vw);padding:16px}
dialog::backdrop{background:#0008}
dialog h2{font:600 17px "Noto Serif TC",serif;margin:0 0 12px}
textarea,dialog input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;margin-bottom:10px}
label{display:block;font-size:14px;color:var(--mute)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.acts.end{justify-content:flex-end;margin-top:16px}
.more{display:block;margin:0 auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;max-width:90vw;z-index:9}
.note{background:var(--soft);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.tm{font:600 12px "Noto Serif TC",serif;color:var(--acc);margin-bottom:2px}
.split{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}.split>div{min-width:0}
.split .media{grid-template-columns:repeat(auto-fill,56px)}.split .th{width:56px;height:56px}
.lh{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 6px}.lh .edit{margin:0}
.r{display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
#tv{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 8px}#tv:disabled{opacity:.4}
#dl{margin-right:auto;color:#c0392b}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--acc);color:var(--onacc);border:0;border-radius:99px;padding:11px 18px;font-size:14px;font-weight:500;box-shadow:0 4px 14px #0004}
#fab[hidden]{display:none}
#lb{background:transparent;border:0;padding:0;width:auto;max-width:96vw;color:#fff;overflow:visible}
#lb img,#lb video{display:block;max-width:94vw;max-height:80vh;border-radius:8px;margin:auto}
#lbx{position:absolute;top:-38px;right:0;background:#0009;color:#fff;border-color:#fff5}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 8px}.tb button{padding:2px 9px}
.sw{flex:none;width:30px;height:30px;border-radius:50%;padding:0;border:2px solid var(--line)}
#tc{-webkit-appearance:none;appearance:none;width:30px;height:30px;padding:0;border:2px solid var(--line);border-radius:50%;overflow:hidden;background:none;flex:none;cursor:pointer}
#tc::-webkit-color-swatch-wrapper{padding:0}#tc::-webkit-color-swatch{border:0;border-radius:50%}#tc::-moz-color-swatch{border:0;border-radius:50%}
.top .acts{margin:0}
@supports (-webkit-touch-callout:none){textarea,input,select{font-size:16px}}
.rm{position:relative}.rm>button{position:absolute;top:4px;right:4px;padding:0 8px;border-radius:99px}
.rm>.cvb{top:auto;right:auto;left:4px;bottom:4px;padding:0 6px;font-size:11px}
.fold{overflow:hidden;-webkit-mask-image:linear-gradient(#000 85%,transparent);mask-image:linear-gradient(#000 85%,transparent)}
.fbt{margin:0 0 12px}
#cvv{width:100%;max-height:40vh;border-radius:8px;background:#000;display:block;margin-bottom:10px}
#cvr{width:100%}
html,body{touch-action:manipulation}
#tagbar{display:none;gap:8px;flex-wrap:wrap;margin-bottom:14px}
#q{display:block;width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;margin-bottom:14px;-webkit-appearance:none;appearance:none}#q[hidden]{display:none}
.tg{border-radius:99px;font-size:12px;padding:1px 10px}.tg.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.tg button{border:0;background:none;padding:0 0 0 6px;color:inherit}
.tgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.ea{display:flex;gap:12px}
.hit{margin-bottom:14px}.rd{font:600 15px "Noto Serif TC",serif}
.tlc{padding:12px 13px}
.tli{display:grid;grid-template-columns:44px 1fr;gap:0 12px}
.tlt{font:600 11px/1.9 "Noto Serif TC",serif;color:var(--acc);text-align:right;padding-right:10px;border-right:2px solid var(--line);position:relative}
.tlt::after{content:"";position:absolute;right:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tlb{min-width:0;padding-bottom:14px}.tli:last-child .tlb{padding-bottom:0}
blockquote{margin:4px 0;padding:2px 10px;border-left:3px solid var(--acc);color:var(--mute)}
.txt ul{margin:4px 0;padding-left:20px}.hd{font-weight:600;font-size:15px}
code{background:var(--soft);border-radius:4px;padding:0 4px;font-size:.92em}
.fl{display:block;grid-column:1/-1;padding:6px 32px 6px 10px;border:1px solid var(--line);border-radius:8px;color:var(--acc);word-break:break-all;font-size:13px;text-decoration:none}
dialog select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 8px;color:inherit;max-width:100%}
.card{font-size:13px}
.card .hd{font-size:14px}
.card .links a,.card .fl,.card .edit,.card button,.card .who{font-size:12px}
.card .tg{font-size:11px}
.card[data-k],.tli[data-k]{cursor:pointer}
.chip.del{color:#c0392b;border-style:dashed}
#cf{width:min(300px,84vw);text-align:center}
#cf p{margin:8px 0 2px;font-size:17px;font-weight:500}
#cf .sm{font-size:13px;color:var(--mute);font-weight:400;margin:0 0 4px}
#cf .acts{justify-content:center;margin:14px 0 4px}
#cf .acts button{min-width:80px;padding:7px 12px}
#dt{width:min(640px,94vw);max-height:88vh;padding:0;overflow:hidden}
#dt[open]{display:flex;flex-direction:column}
#dtc{flex:1;min-height:0;overflow:auto;padding:16px 16px 4px;-webkit-overflow-scrolling:touch}
#dtc>*{margin-bottom:14px}
.dth{font:600 15px "Noto Serif TC",serif;color:var(--acc)}
.dtt{font-size:17px;line-height:1.75}.dtt .hd{font-size:20px}
.dtm{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;border-radius:8px;background:#0001}
video.dtm{background:#000}
#dtc audio{display:block;width:100%}
#dtc .fl{padding:10px 12px;font-size:15px}
.dtl a{display:block;color:var(--acc);word-break:break-all;font-size:15px;margin-bottom:6px}
.dtf{flex:none;padding:10px 14px;text-align:right;border-top:1px solid var(--line)}
.dtf button{padding:6px 18px}
</style>
</head>
<body>
<main>
<div class="top"><div><button onclick="openTh()">主題色</button></div><h1>N年日記</h1><div><button id="bkb" onclick="openBk()">備份</button></div></div>
<div id="ppl"></div>
<div id="tagbar"></div>
<input type="search" id="q" placeholder="搜尋關鍵字、標籤或日期" aria-label="搜尋紀錄" hidden>
<div id="app"></div>
</main>

<dialog id="pd">
<h2>新增對象</h2>
<input type="text" id="pn" placeholder="填入你想記錄的對象" maxlength="30">
<div class="acts end"><button onclick="pd.close()">取消</button><button class="pri" onclick="addP()">建立</button></div>
</dialog>

<dialog id="ed">
<h2 id="et"></h2>
<label>時間</label>
<div class="acts">
<label class="r"><input type="radio" name="tm" value="none" checked> 不記時間</label>
<label class="r"><input type="radio" name="tm" value="now"> 現在時間</label>
<label class="r"><input type="radio" name="tm" value="manual"> 手動輸入</label>
<input type="time" id="tv" disabled aria-label="時間">
</div>
<label for="tx">文字</label>
<div class="tb">
<button onclick="wrap('**')" aria-label="粗體"><b>B</b></button>
<button onclick="wrap('*')" aria-label="斜體"><i>I</i></button>
<button onclick="wrap('++')" aria-label="底線"><u>U</u></button>
<button onclick="wrap('~~')" aria-label="刪除線"><s>S</s></button>
<button onclick="wrap('==')" aria-label="高光"><mark>高光</mark></button>
<button onclick="wrap('`')" aria-label="程式碼"><code>&lt;/&gt;</code></button>
<button onclick="lineP('> ')" aria-label="引用">❝ 引用</button>
<button onclick="lineP('- ')" aria-label="清單">• 清單</button>
<button onclick="lineP('# ')" aria-label="標題">標題</button>
<button onclick="clr('#tx')">清除</button>
</div>
<textarea id="tx" rows="3" placeholder="任何你想記錄的。"></textarea>
<div class="lh"><label for="lk">連結（每行一個）</label><button class="edit" onclick="clr('#lk')">清除連結</button></div>
<textarea id="lk" rows="1" placeholder="https://"></textarea>
<div class="acts">
<button onclick="fi.click()">＋ 照片／影片／音檔／檔案</button>
<button id="rc" onclick="toggleRec()">● 錄音</button>
<input type="file" id="fi" multiple hidden>
</div>
<div class="acts"><button onclick="tagToggle()">＋ 新增標籤</button></div>
<div id="tgd" class="acts" style="margin-top:0"></div>
<div id="tgi" hidden><div class="acts" style="margin:0 0 8px"><input type="text" id="tn" placeholder="輸入標籤" maxlength="20" style="flex:1;margin:0"><button onclick="addTag($('#tn').value)">加入</button></div><div id="tsg" class="acts" style="margin-top:0"></div></div>
<div id="dm" class="media"></div>
<div class="acts end"><button id="dl" onclick="delEntry()">刪除</button><button onclick="$('#ed').close()">取消</button><button class="pri" onclick="save()">儲存</button></div>
</dialog>
<dialog id="bk">
<h2>備份與還原</h2>
<p class="sub" id="blast" style="margin:0 0 12px"></p>
<label for="bsel">備份對象</label>
<select id="bsel" style="margin:6px 0 12px"></select>
<label>匯出</label>
<div class="acts"><button onclick="prepBackup()">準備備份檔</button><button id="bsave" class="pri" style="display:none" onclick="saveBackup()">儲存備份檔</button></div>
<p class="sub" id="bst" style="margin:0 0 16px"></p>
<label>匯入備份檔（與現有資料合併，相同的紀錄以備份檔為準）</label>
<div class="acts"><button onclick="$('#bf').click()">選擇備份檔</button><input type="file" id="bf" accept=".json,application/json" hidden></div>
<p class="sub" id="bst2" style="margin:0"></p>
<div class="acts end"><button onclick="$('#bk').close()">關閉</button></div>
</dialog>
<dialog id="th">
<h2 id="tht">主題色</h2>
<div class="acts" id="swt"></div>
<div class="acts"><label class="r">自訂 <input type="color" id="tc"></label><button onclick="setTheme(null)">恢復預設</button></div>
<div class="acts end"><button onclick="$('#th').close()">關閉</button></div>
</dialog>
<dialog id="cv">
<h2>選擇影片封面</h2>
<video id="cvv" playsinline muted></video>
<input type="range" id="cvr" min="0" max="1000" value="0" aria-label="拖曳選擇畫面">
<div class="acts"><button class="pri" onclick="cvUse()">用這個畫面</button><button onclick="$('#cvf').click()">從相簿選圖</button><input type="file" id="cvf" accept="image/*" hidden></div>
<div class="acts end"><button onclick="$('#cv').close()">取消</button></div>
</dialog>
<dialog id="cf"><p>是否刪除？</p><p class="sm" id="cfs" hidden></p><div class="acts"><button id="cfn">否</button><button id="cfy" class="pri">是</button></div></dialog>
<dialog id="dt"><div id="dtc"></div><div class="dtf"><button class="pri" onclick="$('#dt').close()">退出</button></div></dialog>
<dialog id="lb"><button id="lbx" onclick="$('#lb').close()">關閉 ✕</button><div id="lbc"></div></dialog>
<button id="fab" hidden onclick="fabAdd()">＋ 今日新增</button>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a)k.startsWith('on')?e[k]=a[k]:e.setAttribute(k,a[k]);e.append(...c.flat().filter(x=>x!=null&&x!==false));return e};
let db,useMem=false,M={people:{},entries:{}},people=[],cur=null,E={},urls=[],extra=0,hy=null,multi=false,msel=new Set(),edDate=null,edK=null,draft=[],durls=[],dturls=[],dtags=[],qs='',ftag=null,rlim=50,qt;
const now=new Date();let mo=now.getMonth()+1,dy=now.getDate();

function ask(sub){return new Promise(res=>{const d=$('#cf'),s=$('#cfs');s.textContent=sub||'';s.hidden=!sub;let done=false;
 const fin=v=>{if(done)return;done=true;if(d.open)d.close();res(v)};
 $('#cfy').onclick=()=>fin(true);$('#cfn').onclick=()=>fin(false);d.onclose=()=>fin(false);d.showModal()})}
async function clr(id){const e=$(id);if(e.value&&await ask())e.value=''}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('nyear-diary',1);
q.onupgradeneeded=()=>{q.result.createObjectStore('people',{keyPath:'id'});q.result.createObjectStore('entries',{keyPath:'k'}).createIndex('pid','pid')};
q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>{useMem=true;r()}}catch(e){useMem=true;r()}})}
const req=(st,mode,f)=>new Promise((res,rej)=>{const t=db.transaction(st,mode);const r=f(t.objectStore(st));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
const dbAll=st=>useMem?Promise.resolve(Object.values(M[st])):req(st,'readonly',s=>s.getAll());
const dbPut=(st,v)=>useMem?(M[st][v.id||v.k]=v,Promise.resolve()):req(st,'readwrite',s=>s.put(v));
const dbDel=(st,k)=>useMem?(delete M[st][k],Promise.resolve()):req(st,'readwrite',s=>s.delete(k));
const dbByP=id=>useMem?Promise.resolve(Object.values(M.entries).filter(e=>e.pid===id)):req('entries','readonly',s=>s.index('pid').getAll(id));

async function loadView(){E={};const ids=multi?[...msel]:cur?[cur]:[];for(const id of ids)(await dbByP(id)).forEach(e=>(E[e.date]||(E[e.date]=[])).push(e))}
async function sel(id){cur=id;multi=false;hy=null;extra=0;ftag=null;rlim=50;applyTheme(people.find(p=>p.id===id)?.color);await loadView();render()}
async function toggleMulti(){multi=!multi;if(multi)msel=new Set(people.map(p=>p.id));hy=null;ftag=null;applyTheme(multi?null:people.find(p=>p.id===cur)?.color);await loadView();render()}
async function tog(id){msel.has(id)?msel.delete(id):msel.add(id);if(ftag&&!msel.has(ftag.pid))ftag=null;await loadView();render()}
async function addP(){const n=$('#pn').value.trim();if(!n)return;const p={id:'p'+Date.now(),name:n};await dbPut('people',p);people.push(p);$('#pn').value='';pd.close();sel(p.id)}
async function delP(){const P=people.find(p=>p.id===cur);if(!P||!await ask(`「${P.name}」與全部紀錄都會被刪除`))return;
for(const e of Object.values(E).flat())await dbDel('entries',e.k);await dbDel('people',cur);people=people.filter(p=>p.id!==cur);await sel(people[0]?.id||null)}

const mu=(m,l=urls)=>{const u=URL.createObjectURL(m.b);l.push(u);return u};
function shot(v){const W=480,vw=v.videoWidth||W,vh=v.videoHeight||W,r=Math.min(1,W/vw),c=document.createElement('canvas');c.width=Math.max(1,Math.round(vw*r));c.height=Math.max(1,Math.round(vh*r));
 try{c.getContext('2d').drawImage(v,0,0,c.width,c.height)}catch(e){return Promise.resolve(null)}
 return new Promise(res=>c.toBlob(res,'image/jpeg',.8))}
function mkPoster(b){return new Promise(res=>{const u=URL.createObjectURL(b),v=document.createElement('video');let done=false;
 const fin=r=>{if(done)return;done=true;URL.revokeObjectURL(u);res(r)};
 v.muted=true;v.playsInline=true;v.preload='auto';v.onerror=()=>fin(null);
 v.onloadedmetadata=()=>{v.currentTime=Math.min(.5,(v.duration||1)/2)};

 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(s);
 rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());draft.push({t:'audio',b:new Blob(chunks,{type:rec.mimeType}),n:'錄音'});b.textContent='● 錄音';drawDraft()};
 rec.start();b.textContent='■ 停止錄音'}catch(e){toast('無法使用麥克風，可改用「＋ 照片／影片／音檔／檔案」上傳音檔')}}
async function save(){
 if(rec&&rec.state==='recording')return toast('請先停止錄音');
 addTag($('#tn').value);
 const text=$('#tx').value.trim(),links=$('#lk').value.split(/\s+/).filter(Boolean).map(l=>/^https?:\/\//i.test(l)?l:'https://'+l);
 const old=edK?E[edDate].find(x=>x.k===edK):null,mode=document.querySelector('input[name=tm]:checked').value,time=mode==='none'?null:($('#tv').value||null);
 const empty=!text&&!links.length&&!draft.length&&!dtags.length;
 if(empty&&edK&&!await ask('內容已清空，這則紀錄會被刪除'))return;
 try{if(empty)await removeEntry();
 else{const en={k:edK||`${cur}|${edDate}|${Date.now()}`,pid:old?old.pid:cur,date:edDate,time,text,links,tags:[...dtags],media:draft};
  await dbPut('entries',en);const L=E[edDate]||(E[edDate]=[]),i=L.findIndex(x=>x.k===en.k);i<0?L.push(en):L[i]=en}
 $('#ed').close();render()}catch(e){toast('儲存失敗，可能是檔案太大或空間不足')}}


/* ===== 備份與還原 ===== */
const LBK='nyear-lb2';
function lbMap(){try{const m=JSON.parse(localStorage.getItem(LBK)||'null');if(m)return m;const o=+localStorage.getItem('nyear-lastbackup')||0;return o?{all:o}:{}}catch(e){return{}}}
const lastB=id=>{const m=lbMap();return Math.max(m.all||0,id?m[id]||0:0)};
const markB=v=>{try{const m=lbMap();m[v]=Date.now();localStorage.setItem(LBK,JSON.stringify(m))}catch(e){}};
const b64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
let bkFile=null,bkSel='all';
function updBlast(){const v=$('#bsel').value,t=v==='all'?(lbMap().all||0):lastB(v);$('#blast').textContent=t?'上次備份：'+new Date(t).toLocaleString('zh-TW'):'尚未備份過'}
function openBk(){const s=$('#bsel');rc(s,h('option',{value:'all'},'全部對象'),...people.map(p=>h('option',{value:p.id},p.name)));s.value='all';
 s.onchange=()=>{updBlast();$('#bst').textContent='';$('#bsave').style.display='none';bkFile=null};
 updBlast();$('#bst').textContent='';$('#bst2').textContent='';$('#bsave').style.display='none';bkFile=null;$('#bk').showModal()}
async function prepBackup(){
 const st=$('#bst');bkFile=null;$('#bsave').style.display='none';bkSel=$('#bsel').value;
 try{
  st.textContent='準備中…';
  const all=await dbAll('people'),ps=bkSel==='all'?all:all.filter(p=>p.id===bkSel),
   parts=['{"app":"nyear-diary","v":1,"at":'+JSON.stringify(new Date().toISOString())+',"people":'+JSON.stringify(ps)+',"entries":['];
  let n=0;
  for(const p of ps)for(const e of await dbByP(p.id)){
   const media=[];for(const m of e.media||[])media.push({t:m.t,n:m.n,y:m.b.type,d:await b64(m.b),p:m.p?await b64(m.p):null});
   parts.push((n?',':'')+JSON.stringify({...e,media}));n++;st.textContent='準備中… '+n;
  }
  parts.push(']}');
  const nm=bkSel==='all'?'':'-'+(ps[0]?.name||'').replace(/[\\/:*?"<>|\s]+/g,'_');
  bkFile=new File(parts,'n-year-diary'+nm+'-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
  st.textContent=`完成：${ps.length} 位對象、${n} 則紀錄，約 ${(bkFile.size/1048576).toFixed(1)} MB。請按「儲存備份檔」。`;
  $('#bsave').style.display='';
 }catch(e){st.textContent='備份失敗：'+(e.message||e)}
}
function dl(f){const u=URL.createObjectURL(f),a=h('a',{href:u,download:f.name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function saveBackup(){
 if(!bkFile)return;
 try{
  if(navigator.canShare&&navigator.canShare({files:[bkFile]})){
   try{await navigator.share({files:[bkFile],title:'N年日記備份'})}catch(e){if(e.name==='AbortError')return;dl(bkFile)}
  }else dl(bkFile);
  markB(bkSel);updBlast();render();
  $('#bst').textContent='已送出。請確認檔案真的存到「檔案」App、雲端硬碟或其他安全的地方。';
 }catch(e){toast('無法儲存：'+(e.message||e))}
}
async function importBackup(f){
 const st=$('#bst2');
 try{
  st.textContent='讀取中…';
  const j=JSON.parse(await f.text());
  if(j.app!=='nyear-diary'||!Array.isArray(j.people)||!Array.isArray(j.entries))throw new Error('這不是 N年日記 的備份檔');
  for(const p of j.people)if(p&&p.id&&p.name)await dbPut('people',{id:String(p.id),name:String(p.name).slice(0,30),color:/^#[0-9a-f]{6}$/i.test(p.color||'')?p.color:(people.find(q=>q.id===String(p.id))?.color||null)});
  let n=0;
  for(const e of j.entries){
   if(!e||!e.k||!e.pid||!/^\d{4}-\d{2}-\d{2}$/.test(e.date))continue;
   const media=[];
   for(const m of e.media||[]){if(!['image','video','audio','file'].includes(m.t)||!/^data:/.test(m.d||''))continue;
    const b=await(await fetch(m.d)).blob(),ty=m.t==='file'?(/pdf/i.test(m.y||'')?'application/pdf':'application/octet-stream'):(m.y||b.type),
     it={t:m.t,n:String(m.n||''),b:new Blob([b],{type:ty})};
    if(m.t==='video'&&/^data:image\//.test(m.p||''))it.p=await(await fetch(m.p)).blob();media.push(it)}
   await dbPut('entries',{k:String(e.k),pid:String(e.pid),date:e.date,time:/^\d{2}:\d{2}$/.test(e.time)?e.time:null,text:String(e.text||''),
    links:(e.links||[]).map(String).filter(l=>/^https?:\/\//i.test(l)),tags:(e.tags||[]).map(x=>String(x).slice(0,20)).slice(0,10),media});
   n++;st.textContent=`匯入中… ${n}/${j.entries.length}`;
  }
  people=await dbAll('people');people.sort((a,b)=>a.id<b.id?-1:1);
  await sel(people.find(p=>p.id===cur)?cur:people[0]?.id||null);
  st.textContent=`匯入完成：${n} 則紀錄。`;
 }catch(e){st.textContent='匯入失敗：'+(e.message||e)}
}
$('#bf').onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=''};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
(async()=>{await openDB();people=await dbAll('people');people.sort((a,b)=>a.id<b.id?-1:1);
 try{const g=localStorage.getItem(TK);if(g&&people.length){for(const p of people)if(!p.color){p.color=g;await dbPut('people',p)}localStorage.removeItem(TK)}}catch(e){}
 await sel(people[0]?.id||null)})();
</script>
