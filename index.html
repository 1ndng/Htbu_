<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
{const sm=HTMLDialogElement.prototype.showModal;HTMLDialogElement.prototype.showModal=function(){sm.call(this);const a=document.activeElement;if(a&&a.tagName==='BUTTON'&&this.contains(a)){this.tabIndex=-1;this.focus({preventScroll:true})}}}
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a)k.startsWith('on')?e[k]=a[k]:e.setAttribute(k,a[k]);e.append(...c.flat().filter(x=>x!=null&&x!==false));return e};
let db,useMem=false,M={people:{},entries:{}},people=[],cur=null,E={},urls=[],extra=0,hy=null,multi=false,msel=new Set(),edDate=null,edK=null,draft=[],durls=[],dturls=[],dtags=[],qs='',ftag=null,rlim=50,qt,other=false;

function ask(sub){return new Promise(res=>{const d=$('#cf'),s=$('#cfs');s.textContent=sub||'';s.hidden=!sub;let done=false;
 const fin=v=>{if(done)return;done=true;if(d.open)d.close();res(v)};
 $('#cfy').onclick=()=>fin(true);$('#cfn').onclick=()=>fin(false);d.onclose=()=>fin(false);d.showModal()})}
async function clr(id){const e=$(id);if(e.value&&await ask())e.value=''}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('nyear-diary',1);
q.onupgradeneeded=()=>{q.result.createObjectStore('people',{keyPath:'id'});q.result.createObjectStore('entries',{keyPath:'k'}).createIndex('pid','pid')};
q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>{useMem=true;r()}}catch(e){useMem=true;r()}})}
const req=(st,mode,f)=>new Promise((res,rej)=>{const t=db.transaction(st,mode);const r=f(t.objectStore(st));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
const dbAll=st=>useMem?Promise.resolve(Object.values(M[st])):req(st,'readonly',s=>s.getAll());

const dbByP=id=>useMem?Promise.resolve(Object.values(M.entries).filter(e=>e.pid===id)):req('entries','readonly',s=>s.index('pid').getAll(id));

async function toggleOther(){
 if(!other&&!cur){toast('請先新增對象');return}
 other=!other;if(other)multi=false;hy=null;ftag=null;qs='';$('#q').value='';rlim=50;
 applyTheme(people.find(p=>p.id===cur)?.color);await loadView();render()}
async function tog(id){msel.has(id)?msel.delete(id):msel.add(id);if(ftag&&!msel.has(ftag.pid))ftag=null;await loadView();render()}

$('#pen').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();renameP()}};
async function delP(){const P=people.find(p=>p.id===cur);if(!P||!await ask(`「${P.name}」與全部紀錄都會被刪除`))return;
for(const e of await dbByP(cur))await dbDel('entries',e.k);await dbDel('people',cur);people=people.filter(p=>p.id!==cur);await sel(people[0]?.id||null)}

const mu=(m,l=urls)=>{const u=URL.createObjectURL(m.b);l.push(u);return u};
function shot(v){const W=480,vw=v.videoWidth||W,vh=v.videoHeight||W,r=Math.min(1,W/vw),c=document.createElement('canvas');c.width=Math.max(1,Math.round(vw*r));c.height=Math.max(1,Math.round(vh*r));
 try{c.getContext('2d').drawImage(v,0,0,c.width,c.height)}catch(e){return Promise.resolve(null)}
 return new Promise(res=>c.toBlob(res,'image/jpeg',.8))}
function mkPoster(b){return new Promise(res=>{const u=URL.createObjectURL(b),v=document.createElement('video');let done=false;
 const fin=r=>{if(done)return;done=true;URL.revokeObjectURL(u);res(r)};
 v.muted=true;v.playsInline=true;v.preload='auto';v.onerror=()=>fin(null);
 v.onloadedmetadata=()=>{v.currentTime=Math.min(.5,(v.duration||1)/2)};
 v.onseeked=()=>shot(v).then(fin);v.src=u;setTimeout(()=>fin(null),8000)})}
function toCover(f){return new Promise(res=>{const u=URL.createObjectURL(f),i=new Image();
 i.onload=()=>{const r=Math.min(1,480/i.naturalWidth),c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*r);c.height=Math.round(i.naturalHeight*r);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(res,'image/jpeg',.85)};
 i.onerror=()=>{URL.revokeObjectURL(u);res(null)};i.src=u})}
const fileA=(m,L)=>{const pdf=/pdf/i.test(m.b.type||'')||/\.pdf$/i.test(m.n||'');
 return h('a',{class:'fl',href:mu(m,L),...(pdf?{target:'_blank',rel:'noopener'}:{download:m.n||'file'})},'📄 '+(m.n||'檔案'))};
const mEl=(m,en)=>{
 const L=en?urls:durls;
 if(m.t==='audio')return h('audio',{src:mu(m,L),controls:''});
 if(m.t==='file')return fileA(m,L);
 const u=mu(m,L),go=()=>zoom(m.t,u);let im;
 if(m.t==='image')im=h('img',{src:u,alt:'',loading:'lazy'});
 else{im=h('img',{alt:''});
  if(m.p)im.src=mu({b:m.p},L);
  else mkPoster(m.b).then(p=>{if(!p)return;m.p=p;im.src=mu({b:p},L);if(en)dbPut('entries',en).catch(()=>{})})}
 return h('div',{class:'th',role:'button',tabindex:'0','aria-label':'放大檢視',onclick:go,onkeydown:e=>{if(e.key==='Enter')go()}},im,m.t==='video'&&h('span',{class:'pl'},'▶'))};
let cvM=null,cvU=null;
function openCv(m){cvM=m;const v=$('#cvv');cvU=URL.createObjectURL(m.b);v.src=cvU;$('#cvr').value=0;$('#cv').showModal()}

$('#cvf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const p=await toCover(f);if(p){cvM.p=p;drawDraft()}else toast('無法讀取這張圖片');$('#cv').close()};

const fmtD=d=>{const [y,m,n]=d.split('-').map(Number);return `${y}年${m}月${n}日`};
function openDt(en){dturls.forEach(URL.revokeObjectURL);dturls=[];
 const M=en.media||[],by=t=>M.filter(m=>m.t===t),au=by('audio'),ad=m=>h('audio',{src:mu(m,dturls),controls:''});
 rc($('#dtc'),
  h('div',{class:'dth'},(multi?pname(en.pid)+'・':'')+(en.date===NODATE?'OTHER日記':fmtD(en.date))+(en.time?'　'+en.time:'')),
  en.text&&h('div',{class:'txt dtt'},...blocks(en.text)),

  by('video').map(m=>h('video',{class:'dtm',src:mu(m,dturls),controls:'',playsinline:'',preload:'metadata',...(m.p?{poster:mu({b:m.p},dturls)}:{})})),
  by('file').map(m=>fileA(m,dturls)),
  au.filter(m=>m.n!=='錄音').map(ad),au.filter(m=>m.n==='錄音').map(ad),

 $('#dtc').scrollTop=0;$('#dt').showModal()}

$('#app').addEventListener('click',e=>{
 if(e.target.closest('button,a,audio,video,input,select,textarea,.th'))return;
 const el=e.target.closest('[data-k]');if(!el)return;
 const en=(E[el.dataset.d]||[]).find(x=>x.k===el.dataset.k);if(en)openDt(en)});
function md(t){const out=[],re=/\*\*(.+?)\*\*|==(.+?)==|~~(.+?)~~|\+\+(.+?)\+\+|`(.+?)`|\*(.+?)\*/g;let i=0,m;
 while((m=re.exec(t))){if(m.index>i)out.push(t.slice(i,m.index));
  if(m[5]!=null)out.push(h('code',{},m[5]));
  else{const tag=m[1]!=null?'strong':m[2]!=null?'mark':m[3]!=null?'del':m[4]!=null?'u':'em';
   out.push(h(tag,{},...md(m[1]??m[2]??m[3]??m[4]??m[6])))}
  i=re.lastIndex}
 if(i<t.length)out.push(t.slice(i));return out}
function blocks(t){const out=[],L=t.split('\n');let buf=[],i=0;
 const flush=()=>{if(buf.length){out.push(h('div',{},...md(buf.join('\n'))));buf=[]}};
 while(i<L.length){const l=L[i];
  if(/^> ?/.test(l)){flush();const q=[];while(i<L.length&&/^> ?/.test(L[i]))q.push(L[i++].replace(/^> ?/,''));out.push(h('blockquote',{},...md(q.join('\n'))));continue}
  if(/^- /.test(l)){flush();const it=[];while(i<L.length&&/^- /.test(L[i]))it.push(h('li',{},...md(L[i++].slice(2))));out.push(h('ul',{},it));continue}
  const hm=l.match(/^#{1,3} (.+)/);if(hm){flush();out.push(h('div',{class:'hd'},...md(hm[1])));i++;continue}
  buf.push(l);i++}
 flush();return out}

document.fonts&&document.fonts.ready.then(()=>{fitX();chkClip()});addEventListener('orientationchange',()=>setTimeout(()=>{fitX();chkClip()},300));addEventListener('resize',()=>{fitX();chkClip()});

function lineP(p){const t=$('#tx'),v=t.value,a=t.selectionStart,b=t.selectionEnd,s0=v.lastIndexOf('\n',a-1)+1;let e0=v.indexOf('\n',b);if(e0<0)e0=v.length;

/* ===== 備份與還原 ===== */
const LBK='nyear-lb2';
function lbMap(){try{const m=JSON.parse(localStorage.getItem(LBK)||'null');if(m)return m;const o=+localStorage.getItem('nyear-lastbackup')||0;return o?{all:o}:{}}catch(e){return{}}}
const lastB=id=>{const m=lbMap();return Math.max(m.all||0,id?m[id]||0:0)};
const markB=v=>{try{const m=lbMap();m[v]=Date.now();localStorage.setItem(LBK,JSON.stringify(m))}catch(e){}};
const b64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
let bkFile=null,bkSel='all';
function updBlast(){const v=$('#bsel').value,t=v==='all'?(lbMap().all||0):lastB(v);$('#blast').textContent=t?'上次備份：'+new Date(t).toLocaleString('zh-TW'):'尚未備份過'}
function openBk(){const s=$('#bsel');rc(s,h('option',{value:'all'},'全部對象'),...people.map(p=>h('option',{value:p.id},p.name)));s.value='all';
 s.onchange=()=>{updBlast();$('#bst').textContent='';$('#bsave').style.display='none';bkFile=null};
 updBlast();$('#bst').textContent='';$('#bst2').textContent='';$('#bsave').style.display='none';bkFile=null;$('#bk').showModal()}
async function prepBackup(){
 const st=$('#bst');bkFile=null;$('#bsave').style.display='none';bkSel=$('#bsel').value;
 try{
  st.textContent='準備中…';
  const all=await dbAll('people'),ps=bkSel==='all'?all:all.filter(p=>p.id===bkSel),
   parts=['{"app":"nyear-diary","v":1,"at":'+JSON.stringify(new Date().toISOString())+',"people":'+JSON.stringify(ps)+',"entries":['];
  let n=0;
  for(const p of ps)for(const e of await dbByP(p.id)){
   const media=[];for(const m of e.media||[])media.push({t:m.t,n:m.n,y:m.b.type,d:await b64(m.b),p:m.p?await b64(m.p):null});
   parts.push((n?',':'')+JSON.stringify({...e,media}));n++;st.textContent='準備中… '+n;
  }
  parts.push(']}');
  const nm=bkSel==='all'?'':'-'+(ps[0]?.name||'').replace(/[\\/:*?"<>|\s]+/g,'_');
  bkFile=new File(parts,'n-year-diary'+nm+'-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
  st.textContent=`完成：${ps.length} 位對象、${n} 則紀錄，約 ${(bkFile.size/1048576).toFixed(1)} MB。請按「儲存備份檔」。`;
  $('#bsave').style.display='';
 }catch(e){st.textContent='備份失敗：'+(e.message||e)}
}
function dl(f){const u=URL.createObjectURL(f),a=h('a',{href:u,download:f.name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function saveBackup(){
 if(!bkFile)return;
 try{
  if(navigator.canShare&&navigator.canShare({files:[bkFile]})){
   try{await navigator.share({files:[bkFile],title:'N年日記備份'})}catch(e){if(e.name==='AbortError')return;dl(bkFile)}
  }else dl(bkFile);
  markB(bkSel);updBlast();render();
  $('#bst').textContent='已送出。請確認檔案真的存到「檔案」App、雲端硬碟或其他安全的地方。';
 }catch(e){toast('無法儲存：'+(e.message||e))}
}
async function importBackup(f){
 const st=$('#bst2');
 try{
  st.textContent='讀取中…';
  const j=JSON.parse(await f.text());
  if(j.app!=='nyear-diary'||!Array.isArray(j.people)||!Array.isArray(j.entries))throw new Error('這不是 N年日記 的備份檔');
  for(const p of j.people)if(p&&p.id&&p.name)await dbPut('people',{id:String(p.id),name:String(p.name).slice(0,30),color:/^#[0-9a-f]{6}$/i.test(p.color||'')?p.color:(people.find(q=>q.id===String(p.id))?.color||null),tags:[...new Set([...(people.find(q=>q.id===String(p.id))?.tags||[]),...(Array.isArray(p.tags)?p.tags:[]).map(normTag).filter(Boolean)])].slice(0,200)});
  let n=0;
  for(const e of j.entries){
   if(!e||!e.k||!e.pid||!/^\d{4}-\d{2}-\d{2}$/.test(e.date))continue;
   const media=[];
   for(const m of e.media||[]){if(!['image','video','audio','file'].includes(m.t)||!/^data:/.test(m.d||''))continue;
    const b=await(await fetch(m.d)).blob(),ty=m.t==='file'?(/pdf/i.test(m.y||'')?'application/pdf':'application/octet-stream'):(m.y||b.type),
     it={t:m.t,n:String(m.n||''),b:new Blob([b],{type:ty})};
    if(m.t==='video'&&/^data:image\//.test(m.p||''))it.p=await(await fetch(m.p)).blob();media.push(it)}
   await dbPut('entries',{k:String(e.k),pid:String(e.pid),date:e.date,time:/^\d{2}:\d{2}$/.test(e.time)?e.time:null,text:String(e.text||''),
    links:(e.links||[]).map(String).filter(l=>/^https?:\/\//i.test(l)),tags:(e.tags||[]).map(x=>String(x).slice(0,20)).slice(0,10),media});
   n++;st.textContent=`匯入中… ${n}/${j.entries.length}`;
  }
  people=await dbAll('people');people.sort((a,b)=>a.id<b.id?-1:1);
  await sel(people.find(p=>p.id===cur)?cur:people[0]?.id||null);
  st.textContent=`匯入完成：${n} 則紀錄。`;
 }catch(e){st.textContent='匯入失敗：'+(e.message||e)}
}
$('#bf').onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=''};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
(async()=>{await openDB();people=await dbAll('people');people.sort((a,b)=>a.id<b.id?-1:1);
 try{const g=localStorage.getItem(TK);if(g&&people.length){for(const p of people)if(!p.color){p.color=g;await dbPut('people',p)}localStorage.removeItem(TK)}}catch(e){}
 await sel(people[0]?.id||null)})();
</script>
</body>
</html>
